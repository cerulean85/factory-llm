<script>
const rawMd = "# Factory Operation AI Agent \uc81c\ud488 \ucee8\uc149 \uc815\uc758\uc11c (Concept Definition)\n\n---\n\n## 0. \uc6a9\uc5b4 \uc815\ub9ac (Terminology)\n\n| \uc6a9\uc5b4/\uac1c\ub150 | \uc815\uc758 \ubc0f \ubcf8 \uc2dc\uc2a4\ud15c\uc5d0\uc11c\uc758 \uc758\ubbf8 |\n| :--- | :--- |\n| **Factory Operation AI Agent** | \uc81c\uc870 \ubc0f \uacf5\uc815 \ubb3c\ub958 \ud604\uc7a5\uc758 \ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4\uc640 \uacf5\uc815/\uc790\uc7ac \uad00\ub9ac\uc790\ub97c \uc704\ud55c **\ub300\ud654\ud615 \uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc9c0\ub2a5\ud654 \uc5d0\uc774\uc804\ud2b8** |\n| **Multi-SLM (Small Language Model)** | \ub2e8\uc77c \uac70\ub300 \ubaa8\ub378(LLM) \ub300\uc2e0 \ud2b9\uc815 \uc5ed\ud560(\uc758\ub3c4 \ubd84\ub958 Clas, \uc791\uc5c5 \uacc4\ud68d Plan, \uc2e4\ud589/\uac00\uacf5 Proc)\ub85c \ud2b9\ud654 \ubd84\ud654\ub41c \uacbd\ub7c9 \uc628\ud504\ub808\ubbf8\uc2a4 AI \ubaa8\ub378 \uc5d4\uc9c4 |\n| **Clas-SLM (Classification)** | \uc0ac\uc6a9\uc790 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8\uc758 \uc758\ub3c4 \ubc0f \ub3c4\uba54\uc778(\ubcf4\uc804 SOP, \uc124\ube44/\uc54c\ub78c \ubd84\uc11d, \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801, \uc6b4\uc601 \uc0b0\ucd9c\ubb3c \uc0dd\uc131 \ub4f1)\uc744 \uc2e0\uc18d \ubd84\ub958\ud558\ub294 \uc804\ub2f4 \ubaa8\ub378 |\n| **Plan-SLM (Planning)** | \ubd84\ub958\ub41c \uc758\ub3c4\uc5d0 \ub530\ub77c \uc18c\uc791\uc5c5(Task) \uc21c\uc11c, \ud544\uc694\ud55c \uc9c0\uc2dd \uac80\uc0c9 \ud0a4\uc6cc\ub4dc \ubc0f \uc911\uacc4 \uc11c\ubc84 REST API Function Calling \uacc4\ud68d\uc744 \uc218\ub9bd\ud558\ub294 \uc804\ub2f4 \ubaa8\ub378 |\n| **Proc-SLM (Processing)** | \uacc4\ud68d\uc5d0 \ub530\ub77c \uc9c0\uc2dd \uac80\uc0c9 \uacb0\uacfc \uc694\uc57d, \uc911\uacc4 \uc11c\ubc84 \uc218\uc2e0 \ub370\uc774\ud130\uc758 \ud1b5\uacc4 \uc5f0\uc0b0 \ubc0f \ub300\ud654\ud615 \ud45c(Table)/\uce74\ub4dc \ud53c\ub4dc\ubc31\uc744 \uac00\uacf5\ud558\ub294 \uc804\ub2f4 \ubaa8\ub378 |\n| **RAG (Retrieval-Augmented Generation)** | \uacf5\uc7a5 \ub0b4 \ube44\uc815\ud615 \uc9c0\uc2dd(\uc124\ube44 \ubcf4\uc804 SOP, \uc815\ube44 \ub9e4\ub274\uc5bc PDF, \ub3c4\uba74)\uc744 Vector DB\uc5d0 \uc800\uc7a5\ud558\uace0, \uc9c8\uc758\uc640 \uc720\uc0ac\ud55c \ub0b4\uc6a9\uc744 \uac80\uc0c9\ud558\uc5ec \uc0ac\uc2e4(Grounding) \uae30\ubc18\uc73c\ub85c \ub2f5\ubcc0\ud558\ub294 \uae30\uc220 |\n| **\ud504\ub85c\uc81d\ud2b8 \uc804\uc6a9 \uc9c0\uc2dd \ud55c\uc815 \uac80\uc0c9** | \uc804\uccb4 \uacf5\uc7a5 \ubb38\uc11c \ub300\uc2e0 \uc0ac\uc6a9\uc790\uac00 \uc9c0\uc815\ud55c \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \ub0b4 \ubb38\uc11c\ub85c\ub9cc \uac80\uc0c9 \ubc94\uc704\ub97c \ud55c\uc815\ud558\uc5ec \ud0c0 \uc124\ube44 \ub9e4\ub274\uc5bc\uacfc\uc758 \ud63c\uc120\uc744 \uc6d0\ucc9c \ucc28\ub2e8\ud558\ub294 \ub9de\ucda4\ud615 \uc815\ubc00 \uac80\uc0c9 \uae30\uc220 |\n| **\uc911\uacc4 \uc11c\ubc84 (Relay Server)** | \uc124\ube44 PLC \ubc0f \uc6d0\uc2dc DB\uc5d0 \ub300\ud55c \uc9c1\uc811 \uc811\uadfc\uc744 \ucc28\ub2e8\ud558\uace0, \uaddc\uaca9\ud654\ub41c REST API \uc778\ud130\ud398\uc774\uc2a4\ub97c \ud1b5\ud574 \uc548\uc804\ud558\uac8c \ub370\uc774\ud130\ub97c \uc870\ud68c\ud560 \uc218 \uc788\ub3c4\ub85d \uc9c0\uc6d0\ud558\ub294 \ub2e8\uc77c \uc811\uc810 \uad00\ubb38 |\n| **Function Calling** | \uc790\uc5f0\uc5b4 \ud504\ub86c\ud504\ud2b8\uc5d0\uc11c \uc124\ube44\uad70, \ud638\uae30, \uae30\uac04 \ub4f1 \ud30c\ub77c\ubbf8\ud130\ub97c \ucd94\ucd9c\ud558\uc5ec \uc911\uacc4 \uc11c\ubc84 REST API \uaddc\uaca9(JSON)\uc5d0 \ub9de\uac8c \ud638\ucd9c\ud558\ub294 SLM \ub3c4\uad6c \uc5f0\uacc4 \uae30\ub2a5 |\n| **\uacf5\uc815 \uc7ac\uace0 (\uc7ac\uacf5\ud488)** | \uacf5\uc815 \uac04 \ubc84\ud37c \uad6c\uc5ed\uc5d0 \uc801\uc7ac\ub418\uc5b4 \ud6c4\uc18d \uac00\uacf5/\uc870\ub9bd \ud22c\uc785\uc744 \ub300\uae30 \uc911\uc778 \uc911\uac04 \uc0dd\uc0b0\ud488 \ubc0f \ubc84\ud37c \uc7ac\uace0 |\n| **\uccb4\ub958 \uc2dc\uac04 (Dwell Time)** | \uacf5\uc815 \uc9c0\uc5f0 \ubc29\uc9c0 \ubc0f \ud488\uc9c8 \uad00\ub9ac\ub97c \uc704\ud574 \ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uad00\ub9ac\ub418\ub294 \uacf5\uc815 \uc7ac\uace0\uc758 \ub300\uae30 \uc2dc\uac04 |\n| **FIFO (First-In, First-Out)** | \uba3c\uc800 \uc785\uace0\ub41c \uc790\uc7ac\ub098 \uc7ac\uace0\ub97c \uba3c\uc800 \ud22c\uc785\u00b7\ucd9c\uace0\ud558\ub294 \uc120\uc785\uc120\ucd9c \uad00\ub9ac \uc6d0\uce59 |\n| **SOP (Standard Operating Procedure)** | \uc124\ube44 \uc54c\ub78c/\uc7a5\uc560 \ubc1c\uc0dd \uc2dc 1~N\ub2e8\uacc4\ub85c \uc900\uc218\ud574\uc57c \ud558\ub294 \ud604\uc7a5 \ud45c\uc900 \uc810\uac80 \ubc0f \uc870\uce58 \uc218\uc21c\uc11c |\n| **Grounding (\ud658\uac01 \uc5b5\uc81c)** | \uc751\ub2f5 \ub0b4\uc6a9\uc744 \uac80\uc0c9\ub41c \uc6d0\ubcf8 \ubb38\uc11c \uadfc\uac70\uc5d0 \ud55c\uc815\ud558\uace0 \ubb38\uc11c\uba85 \ubc0f \ud398\uc774\uc9c0 \ub525\ub9c1\ud06c\ub97c \ud568\uaed8 \uc81c\uc2dc\ud558\uc5ec \ud658\uac01\uc744 \uc6d0\ucc9c \ucc28\ub2e8\ud558\ub294 AI \uae30\ubcf8 \uc0ac\uc591 |\n| **\uac1c\uc778\ud654 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4** | \ub2f4\ub2f9 \uc124\ube44 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74\uc744 \uc0ac\uc804 \ub4f1\ub85d\ud558\uc5ec \uc138\uc158 \ucd08\uc6d4 \uc601\uad6c \uc7ac\ucc38\uc870\ub97c \uc9c0\uc6d0\ud558\ub294 \uc804\uc6a9 \uc9c0\uc2dd \uacf5\uac04 (\ud50c\ub7ab\ud3fc \ud3b8\uc758 \uae30\ub2a5) |\n| **BCP (Business Continuity Plan)** | \ub124\ud2b8\uc6cc\ud06c \ub2e8\uc120 \ub4f1 \ube44\uc0c1 \uc0c1\ud669 \uc2dc \ud604\uc7a5 \uc81c\uc5b4\ubc18 \uc218\ub3d9 \uc6b4\uc804(Manual Override) \uc804\ud658 \ubc0f \ube44\uc0c1 \ub300\uc751 \uc808\ucc28\uc11c |\n| **PM (Preventive Maintenance)** | \uc124\ube44 \uace0\uc7a5\uc744 \uc608\ubc29\ud558\uae30 \uc704\ud574 \uc815\uae30\uc801(\uc77c/\uc8fc/\uc6d4)\uc73c\ub85c \uc218\ud589\ud558\ub294 \uc608\ubc29 \ubcf4\uc804 \uc810\uac80 \uccb4\ud06c\ub9ac\uc2a4\ud2b8 |\n\n---\n\n## 1. \uc81c\ud488 \uac1c\uc694 (Product Overview)\n\n### 1.1. \uc81c\ud488 \uc815\uc758\n- **\uc81c\ud488\uba85**: Factory Operation AI Agent (\uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc6b4\uc601 \uc9c0\uc6d0 AI \uc5d0\uc774\uc804\ud2b8)\n- **\uc815\uc758**: \ubcf5\uc7a1\ud55c SCADA/MES \ub300\uc2dc\ubcf4\ub4dc\ub098 \uc6d0\uc2dc \ub85c\uadf8 \ubdf0\uc5b4\ub97c \uc77c\uc77c\uc774 \ucc3e\uc544 \ud5e4\ub9e4\uc9c0 \uc54a\uace0, \uc790\uc5f0\uc5b4 \ub300\ud654 \ud55c \ubc88\uc73c\ub85c **\uc124\ube44 \ubcf4\uc804 SOP \uc548\ub0b4, \uc124\ube44 \uc131\ub2a5\u00b7\uac00\ub3d9\ub960\u00b7\uc54c\ub78c \ud1b5\uacc4 \ubd84\uc11d, \uacf5\uc815 \uc7ac\uace0 \uccb4\ub958 \uc9c0\uc5f0 \ucd94\uc801, \uc6b4\uc601 \ud45c\uc900 \uc0b0\ucd9c\ubb3c(PM/\uc2dc\uc6b4\uc804/BCP) \uc790\ub3d9 \uc0dd\uc131**\uc744 \uc9c0\uc6d0\ud558\ub294 **Chat-First \uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc9c0\ub2a5\ud654 \uc194\ub8e8\uc158**\n\n### 1.2. \ubaa9\ud45c \uc0ac\uc6a9\uc790 (Target Persona)\n- \ud604\uc7a5 \ubb3c\ub958 \ubc0f \uc790\ub3d9\ud654 \uc124\ube44 \ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4\n- \uc790\uc7ac/\ucc3d\uace0 \ubc0f \uacf5\uc815 \ubb3c\ub958 \uad00\ub9ac\uc790\n- \uacf5\uc7a5 \uc6b4\uc601 \ubc0f \uc0dd\uc0b0 \uae30\uc220 \uad00\ub9ac\uc790\n\n---\n\n### 1.4. 4\ub300 \ud575\uc2ec \uc81c\uacf5 \uac00\uce58 (Core Value Proposition)\n\n\ubcf8 \uc2dc\uc2a4\ud15c\uc740 \uc0c1\uc2dc \uac10\uc2dc\ud615 \uad00\uc81c \ubaa8\ub2c8\ud130\ub9c1 \ub300\uc2dc\ubcf4\ub4dc\ub098 \uc804\ubb38 \uadf8\ub798\ud53d \ubdf0\uc5b4\uac00 \uc544\ub2c8\uba70, \uc0ac\uc6a9\uc790\uc758 \uc790\uc5f0\uc5b4 \uc9c8\uc758\uc5d0 \ub530\ub77c **Multi-SLM \uc5d4\uc9c4(\uc758\ub3c4 \ubd84\ub958 \u2794 \uc791\uc5c5 \uacc4\ud68d \u2794 \uc2e4\ud589/\uac00\uacf5)**\uc774 \uc9c0\uc2dd\ubca0\uc774\uc2a4 \ubc0f \uc911\uacc4 \uc11c\ubc84 REST API\ub97c \uc5f0\uacc4\ud558\uc5ec \ucd5c\uc801\uc758 \uc9c4\ub2e8 \ubc0f \ubd84\uc11d \uacb0\uacfc\ub97c \ub3c4\ucd9c\ud558\ub294 **\ub300\ud654\ud615 \uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc9c0\ub2a5\ud654 \uc5d0\uc774\uc804\ud2b8**\ub85c\uc11c \ub2e4\uc74c **4\ub300 \ube44\uc988\ub2c8\uc2a4 \ud575\uc2ec \uac00\uce58**\ub97c \uc81c\uacf5\ud569\ub2c8\ub2e4.\n\n| \ubc88\ud638 | 4\ub300 \ud575\uc2ec \uc81c\uacf5 \uac00\uce58 (Core Value) | \uc8fc\uc694 \uc81c\uacf5 \ub0b4\uc6a9 \ubc0f \ud6a8\uacfc | \ub300\uc751 \uc138\ubd80 \uae30\ub2a5 ID |\n| :---: | :--- | :--- | :--- |\n| **1** | **\ubb3c\ub958 \uc124\ube44 \ubcf4\uc804 \uc9c0\uc2dd & SOP \ub9e4\ub274\uc5bc \uc548\ub0b4** | \uc124\ube44 \uc54c\ub78c/\uc7a5\uc560 \ubc1c\uc0dd \uc2dc \uc9c0\uc2dd \uac80\uc0c9\uc73c\ub85c 1~N\ub2e8\uacc4 \ud45c\uc900 \uc810\uac80 \uc218\uc21c, \ubd80\ud488 \uaddc\uaca9, \ub3c4\uba74 \uc704\uce58\ub97c \ub300\ud654\ud615\uc73c\ub85c \ub2e8\uacc4\ubcc4 \uc989\uc2dc \uc548\ub0b4 (**MTTR \ub2e8\ucd95**) | `FN-SOP-01 ~ 04` |\n| **2** | **\ubb3c\ub958 \uc124\ube44 \uc131\ub2a5 \ubc0f \uac00\ub3d9\ub960/\uc54c\ub78c \ubd84\uc11d** | \uc790\uc5f0\uc5b4 \uc9c8\uc758\ub85c \uc124\ube44\ubcc4 \uac00\ub3d9 \uc2e4\uc801, \uc2dc\uac04\uac00\ub3d9\ub960(OEE), \ubcd1\ubaa9 \uad6c\uac04 \uc2dd\ubcc4, \ube44\uac00\ub3d9 \uc6d0\uc778 \ubc0f \ube48\ubc1c \uc54c\ub78c \ud1b5\uacc4 \ub9ac\ud3ec\ud2b8 \uc81c\uacf5 (**\uac00\ub3d9\ub960 \uadf9\ub300\ud654**) | `FN-EQP-01 ~ 05` |\n| **3** | **\uc790\uc7ac \ubc0f \uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801** | WMS/MES \uc5f0\ub3d9\uc744 \ud1b5\ud574 \uc120\uc785\uc120\ucd9c(FIFO) \uc704\ubc18, \uc720\ud6a8\uae30\uac04(D-day) \uc784\ubc15 \uc790\uc7ac, \uacf5\uc815 \ubc84\ud37c \uccb4\ub958 \uc2dc\uac04 \ucd08\uacfc(\uc9c0\uc5f0)\ub97c \ub300\ud654\ud615\uc73c\ub85c \ucd94\uc801\u00b7\uc9c4\ub2e8 (**\uc790\uc7ac \ubcc0\uc9c8/\uc815\uccb4 \ubc29\uc9c0**) | `FN-INV-01 ~ 03` |\n| **4** | **AI \uc2dc\uc2a4\ud15c \uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c \uc790\ub3d9 \uc81c\uacf5** | \ud45c\uc900 \ub9c8\uc2a4\ud130 \ub370\uc774\ud130, \uc815\uae30 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8, \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uac00\uc774\ub4dc, BCP \uc218\ub3d9 \uc804\ud658 \uc808\ucc28\uc11c \ub4f1 \ud45c\uc900 \uc6b4\uc601 \ubb38\uc11c\ub97c \uc790\ub3d9 \uc0dd\uc131 (**\ubb38\uc11c \uc791\uc5c5 \uacf5\uc218 80% \uc808\uac10**) | `FN-ADV-01 ~ 03` |\n\n---\n\n### 1.5. 4\ub300 \ud575\uc2ec \uac00\uce58\ubcc4 \uc138\ubd80 \uae30\ub2a5 \uba85\uc138 (Function / Input / HOW / Output)\n\n#### 1.5.1. [\uac00\uce58 1] \ubb3c\ub958 \uc124\ube44 \ubcf4\uc804 \uc9c0\uc2dd & SOP \ub9e4\ub274\uc5bc \uc548\ub0b4\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-SOP-01** | **\uc124\ube44 \uace0\uc7a5 \uc870\uce58 SOP \ub2e8\uacc4\ubcc4 \uac00\uc774\ub4dc** | \u2022 \ubb3c\ub958 \uc124\ube44 \uc54c\ub78c \ubc1c\uc0dd \uc2dc 1~N\ub2e8\uacc4 \ud604\uc7a5 \ud45c\uc900 \uc810\uac80 \ubc0f \uc870\uce58 \uc218\uc21c(SOP)\uc744 \uc790\uc5f0\uc5b4\ub85c \ub2e8\uacc4\ubcc4 \uc548\ub0b4<br>\u2022 LOTO(\uc548\uc804 \uc7a0\uae08) \ubc0f \uc804\uc6d0 \ucc28\ub2e8 \uc548\uc804 \uc218\uce59 \uac15\uc870 | \u2022 \uc790\uc5f0\uc5b4 \uc9c8\uc758 (\uc608: *\"AGV 3\ud638\uae30 \ub77c\uc778 \uc774\ud0c8 \uc54c\ub78c(ERR-104) \uc870\uce58 SOP \uc54c\ub824\uc918\"* )<br>\u2022 \uc124\ube44 \ubaa8\ub378\uba85, \uc5d0\ub7ec \ucf54\ub4dc | 1. **Clas-SLM**: \ud504\ub86c\ud504\ud2b8 \uc758\ub3c4(SOP \uc9c8\uc758) \ubc0f \ub300\uc0c1 \uc124\ube44/\uc5d0\ub7ec\ucf54\ub4dc \ucd94\ucd9c<br>2. **Plan-SLM**: SOP \uc9c0\uc2dd DB \uac80\uc0c9 \ucffc\ub9ac \uacc4\ud68d \uc218\ub9bd<br>3. **Proc-SLM**: \uc720\uc0ac\ub3c4 \uae30\ubc18 \uc9c0\uc2dd \uac80\uc0c9 \u2794 \uc548\uc804 \uc218\uce59 \ubc0f 1~N\ub2e8\uacc4 \uc810\uac80 \uccb4\ud06c\ud3ec\uc778\ud2b8 \uc694\uc57d \uac00\uacf5 | \u2022 1~N\ub2e8\uacc4 \uccb4\ud06c\ud3ec\uc778\ud2b8 \uce74\ub4dc<br>\u2022 \uc791\uc5c5 \uc804 \uc548\uc804 \uc720\uc758\uc0ac\ud56d \ubc30\ub108<br>\u2022 \ucc38\uc870 SOP \uc6d0\ubb38 \ucd9c\ucc98 \ubc0f \ud398\uc774\uc9c0 \ub525\ub9c1\ud06c |\n| **FN-SOP-02** | **\uc124\ube44 \uc815\ube44 \ubc0f \uc720\uc9c0\ubcf4\uc218 \ub9e4\ub274\uc5bc \uc9c0\uc6d0** | \u2022 \uc815\uae30 \uc810\uac80 \uc8fc\uae30, \uc18c\ubaa8\ud488/\ubd80\ud488 \uad50\uccb4 \uac00\uc774\ub4dc, \uccb4\uacb0 \ud1a0\ud06c \uae30\uc900, \ubd84\ud574/\uc870\ub9bd \uc218\uc21c \uc9c8\uc758\uc751\ub2f5<br>\u2022 \uc21c\uc815 \ubd80\ud488 \ud488\ubc88(Part Number) \uc548\ub0b4 | \u2022 \ubd80\ud488\uba85, \uc124\ube44 \ubaa8\ub378\uba85 \uc9c8\uc758 (\uc608: *\"S/C \uc640\uc774\uc5b4\ub85c\ud504 \uad8c\uc7a5 \uad50\uccb4 \uc8fc\uae30 \ubc0f \uaddc\uaca9\"* ) | 1. **\uc9c0\uc2dd \uac80\uc0c9 \ud30c\uc774\ud504\ub77c\uc778**: \uc815\ube44 \ub9e4\ub274\uc5bc \ub0b4 \ubd80\ud488 \uc2a4\ud399, \uc815\uae30 \uc810\uac80\ud45c, \ubd84\ud574/\uc870\ub9bd \uc139\uc158 \uccad\ud06c \uac80\uc0c9<br>2. **Proc-SLM**: \ube44\uc815\ud615 \ud14d\uc2a4\ud2b8\uc5d0\uc11c \ud1a0\ud06c \uc218\uce58(N\u00b7m), \uad8c\uc7a5 \uc8fc\uae30, \ud30c\ud2b8 \ubc88\ud638 \uc815\ud615\ud654 \ucd94\ucd9c | \u2022 \ubd80\ud488 \uc815\ube44 \uc2a4\ud399 \ud45c(\ud1a0\ud06c, \uaddc\uaca9, \uc8fc\uae30)<br>\u2022 \ubd84\ud574/\uc870\ub9bd \uc21c\uc11c\ub3c4 \ubc0f \uc8fc\uc758\uc0ac\ud56d |\n| **FN-SOP-03** | **\uace0\uc7a5 \uc870\uce58 \uc774\ub825 \ud0d0\uc0c9 (Troubleshooting)** | \u2022 \uacfc\uac70 \ub3d9\uc885 \uc124\ube44/\uc54c\ub78c \ubc1c\uc0dd \uc0ac\ub840 \ubc0f \ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4\uc758 \uc870\uce58 \uc774\ub825 \uac80\uc0c9\uc744 \ud1b5\ud55c \uc6d0\uc778 \uaddc\uba85 | \u2022 \uc54c\ub78c \ucf54\ub4dc, \uc774\uc0c1 \ud604\uc0c1 \ud14d\uc2a4\ud2b8 (\uc608: *\"RGV \uac10\uc18d \uc774\uc0c1 \ube48\ubc1c \uc6d0\uc778 \ubc0f \uc870\uce58 \uc0ac\ub840\"* ) | 1. **\uc9c0\uc2dd\ubca0\uc774\uc2a4 \ud0d0\uc0c9**: \uacfc\uac70 \ud2b8\ub7ec\ube14\uc288\ud305 \uc774\ub825 \ubc0f \ud2b9\uc774 \uace0\uc7a5 \uc870\uce58 \ub370\uc774\ud130 \uccad\ud06c \uac80\uc0c9<br>2. **\ubd84\uc11d \uc5d4\uc9c4**: \uc6d0\uc778\ubcc4 \ubc1c\uc0dd \ube48\ub3c4 \uc9d1\uacc4 \ubc0f \ud574\uacb0 \uc131\uacf5 \uc0ac\ub840 \uc2a4\ucf54\uc5b4\ub9c1 \ub7ad\ud0b9 \ub3c4\ucd9c | \u2022 \uc720\uc0ac \uc7a5\uc560 Top 3 \uc870\uce58 \uc0ac\ub840 \ubaa9\ub85d<br>\u2022 \uc6d0\uc778\ubcc4 \uc810\uc720\uc728(%) \ud1b5\uacc4 \ud45c |\n| **FN-SOP-04** | **\uba40\ud2f0\ubaa8\ub2ec \ub9e4\ub274\uc5bc \uc9c0\uc2dd \uc735\ud569** | \u2022 \uc0ac\uc6a9\uc790\uac00 \uc5c5\ub85c\ub4dc\ud55c PDF, Office, \ub3c4\uba74 \ud30c\uc77c(\ucd5c\ub300 50MB)\uc744 \uc2e4\uc2dc\uac04 \ud30c\uc2f1\u00b7\uc784\ubca0\ub529\ud558\uc5ec \ubb38\uc11c \ub0b4 \uc138\ubd80 \uc870\uce58\ubc95 \uac80\uc0c9 | \u2022 \uc815\ube44 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74 \ud30c\uc77c \ucca8\ubd80 + *\"\ucca8\ubd80\ud55c \ub9e4\ub274\uc5bc\uc5d0\uc11c \uc5d0\ub7ec\ucf54\ub4dc E-203 \uc870\uce58\ubc95 \ucc3e\uc544\uc918\"* | 1. **PDF Parser Engine**: \uc5c5\ub85c\ub4dc \ud30c\uc77c \ud14d\uc2a4\ud2b8/\ud45c/\ub3c4\uba74 OCR \uc2e4\uc2dc\uac04 \ud30c\uc2f1<br>2. **\uc9c0\uc2dd \uc784\ubca0\ub529 \ub9e4\uce6d**: \uc138\uc158 \uc784\ubca0\ub529 \uc0dd\uc131 \ubc0f \uc9c8\uc758 \uc720\uc0ac\ub3c4 \ub9e4\uce6d<br>3. **Proc-SLM**: \uc6d0\ubcf8 \ud398\uc774\uc9c0 \uc88c\ud45c \ubc0f \ud14d\uc2a4\ud2b8 \uc694\uc57d \ub3c4\ucd9c | \u2022 \uc5d0\ub7ec \uc804\uc6a9 \uc870\uce58 \uc694\uc57d\ubb38<br>\u2022 \uc6d0\ubb38 \ud398\uc774\uc9c0 \ucc38\uc870 \ub525\ub9c1\ud06c<br>\u2022 \uad00\ub828 \ubc30\uc120\ub3c4/\ub3c4\uba74 \ucea1\ucc98 \uc601\uc5ed \uc548\ub0b4 |\n\n#### 1.5.2. [\uac00\uce58 2] \ubb3c\ub958 \uc124\ube44 \uc131\ub2a5 \ubc0f \uac00\ub3d9\ub960/\uc54c\ub78c \ubd84\uc11d\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-EQP-01** | **\ubb3c\ub958 \uc774\uc1a1 \uc124\ube44 \uc774\uc0c1 \uc9c4\ub2e8 \ubc0f \ud604\ud669 \uc9c8\uc758** | \u2022 AGV \ubc0f \ubb34\uc778 \uc9c0\uac8c\ucc28\uc758 \uc6b4\uc804 \ubaa8\ub4dc, \uc800\ubc30\ud130\ub9ac, \uacbd\ub85c \uc774\ud0c8 \ubc0f \uc7a5\uc560 \uc815\uc9c0 \ub4f1 \uc774\uc0c1 \uc0c1\ud0dc \uc9c8\uc758\uc751\ub2f5 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"AGV \uc804\uccb4 \uac00\ub3d9 \uc0c1\ud0dc\uc640 \ubc30\ud130\ub9ac 20% \ubbf8\ub9cc \ucc28\ub7c9 \ubc0f \uc774\uc0c1 \uc0c1\ud0dc \uc870\ud68c\"* ) | 1. **Plan-SLM**: \uc790\uc5f0\uc5b4\uc5d0\uc11c \uc124\ube44 \uadf8\ub8f9(AGV) \ubc0f \ud544\ud130 \uc870\uac74(\ubc30\ud130\ub9ac < 20%, \uc5d0\ub7ec \uc0c1\ud0dc) \ud30c\ub77c\ubbf8\ud130 \ucd94\ucd9c<br>2. **Function Calling**: \uc911\uacc4 \uc11c\ubc84 REST API (`GET /api/v1/relay/agv/status`) \ud638\ucd9c<br>3. **Proc-SLM**: \uc218\uc2e0\ub41c JSON \ub370\uc774\ud130 \uc870\uac74 \ud544\ud130\ub9c1 \ubc0f \uc694\uc57d \uc11c\uc2dd \uac00\uacf5 | \u2022 \uc774\uc1a1 \uc124\ube44 \uc0c1\ud0dc \ud45c (\ud638\uae30, \uc874, \ubc30\ud130\ub9ac, \uc0c1\ud0dc)<br>\u2022 \uc800\ubc30\ud130\ub9ac/\uc774\uc0c1 \uc124\ube44 \uacbd\uace0 \ud558\uc774\ub77c\uc774\ud2b8 |\n| **FN-EQP-02** | **\uc790\ub3d9\ud654 \uc774\uc1a1 \uc2dc\uc2a4\ud15c \ucc98\ub9ac \uc131\ub2a5 \ubc0f \ubcd1\ubaa9 \uc9c4\ub2e8** | \u2022 Sorting C/V, Lifter, Diverter, RGV, Gantry, S/C \ub77c\uc778\ubcc4 \uc2dc\uac04\ub2f9 \ucc98\ub9ac\ub7c9(TPH), \uc0ac\uc774\ud074 \ud0c0\uc784 \ube44\uad50 \ubc0f \ubcd1\ubaa9 \uad6c\uac04 \uc2dd\ubcc4 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ud604\uc7ac AS/RS 1~4\ud638\uae30 S/C \ucc98\ub9ac\ub7c9 \ud3b8\ucc28 \ubc0f \uc18d\ub3c4 \uc800\ud558 \uad6c\uac04 \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 \uc5f0\ub3d9**: \uc124\ube44\ubcc4 \uc2e4\uc801 \ub370\uc774\ud130 \uc218\uc9d1 API \ud638\ucd9c<br>2. **\uc131\ub2a5 \uc5f0\uc0b0**: \ud638\uae30\ubcc4 TPH \ubc0f \ud3c9\uade0 \uc0ac\uc774\ud074 \ud0c0\uc784 \uacc4\uc0b0 \ud6c4 \uc124\uacc4 \uae30\uc900\uce58\uc640 \ud3b8\ucc28 \ube44\uad50<br>3. **Proc-SLM**: \ubcd1\ubaa9 \uad6c\uac04 \uc790\ub3d9 \uc2dd\ubcc4 \ubc0f \ube44\uad50 \uc694\uc57d \ud45c \uc0dd\uc131 | \u2022 \ud638\uae30\ubcc4 TPH, \ud3c9\uade0 \uc0ac\uc774\ud074 \ud0c0\uc784 \ube44\uad50 \ud45c<br>\u2022 \ubcd1\ubaa9/\uc18d\ub3c4 \uc800\ud558 \uad6c\uac04 \uc9c4\ub2e8 \ucf54\uba58\ud2b8 |\n| **FN-EQP-03** | **\uc801\uc7ac/\ud22c\uc785 \uc124\ube44 \uac00\ub3d9 \uc0c1\ud0dc \ubc0f \ud050 \uc815\uccb4 \ubd84\uc11d** | \u2022 \ub85c\ub354/\uc5b8\ub85c\ub354 \uac00\ub3d9 \uc0c1\ud0dc, \ubc84\ud37c \ub300\uae30 \ud050 \uc815\uccb4 \ubc0f \ud22c\uc785 \uc9c0\uc5f0 \uc694\uc778 \ubd84\uc11d | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ud22c\uc785 \ub85c\ub354 3\ubc88 \uac00\ub3d9 \uc0c1\ud0dc \ubc0f \uc794\uc5ec \ud22c\uc785 \ub300\uae30\ub7c9, \uc815\uccb4 \uc5ec\ubd80 \ud655\uc778\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 API \uc5f0\ub3d9**: \ub300\uc0c1 \ub85c\ub354\uc758 PLC \uc811\uc810 \uc0c1\ud0dc\uac12 \ubc0f \ubc84\ud37c \ub300\uae30 \ud050 \ub370\uc774\ud130 \uc218\uc9d1<br>2. **Proc-SLM**: \uc124\ube44 \uc6b4\uc804 \ubaa8\ub4dc(Auto/Manual/Alarm) \ubc0f \ub300\uae30 \ud050 \uacfc\ubd80\ud558 \uc9c4\ub2e8 \uc694\uc57d \uce74\ub4dc \ub80c\ub354\ub9c1 | \u2022 \uc124\ube44 \uc0c1\ud0dc \uc694\uc57d \uce74\ub4dc (\uc0c1\ud0dc, \uc2dc\uac04\ub2f9 \ud22c\uc785 \uc2e4\uc801, \ub300\uae30 \ud050 \uc815\uccb4 \uc9c4\ub2e8) |\n| **FN-EQP-04** | **\uc124\ube44 \uac00\ub3d9\ub960 \ubc0f \ube44\uac00\ub3d9 \uc6d0\uc778 \ubd84\uc11d** | \u2022 \uc77c\uac04/\uc8fc\uac04/\uc6d4\uac04 \uc124\ube44\ubcc4 \uc2dc\uac04\uac00\ub3d9\ub960(OEE) \uc9d1\uacc4 \ubc0f \ube44\uac00\ub3d9 \uc6d0\uc778(\uc124\ube44 \uace0\uc7a5, \uc790\uc7ac \ub300\uae30 \ub4f1) \ube44\uc728 \ubd84\uc11d \ub9ac\ud3ec\ud2b8 \uc0dd\uc131 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc774\ubc88 \uc8fc RGV \ub77c\uc778 \ube44\uac00\ub3d9 \uc6d0\uc778 Top 3 \ubc0f \uac00\ub3d9\ub960 \ub9ac\ud3ec\ud2b8\"* ) | 1. **\ud30c\ub77c\ubbf8\ud130 \ud30c\uc2f1**: \uae30\uac04(\uc8fc\uac04), \uc124\ube44\uad70(RGV) \ucd94\ucd9c<br>2. **\ub370\uc774\ud130 \uc218\uc9d1**: \uc911\uacc4 \uc11c\ubc84 \uac00\ub3d9\ub960/\uc54c\ub78c \ub85c\uadf8 API \uc5f0\ub3d9<br>3. **\ud1b5\uacc4 \ubd84\uc11d**: \uac00\ub3d9/\uc815\uc9c0/\ub300\uae30 \uc2dc\uac04 \uc9d1\uacc4, \ube44\uac00\ub3d9 \uc694\uc778\ubcc4 \ud30c\ub808\ud1a0 \ubd84\uc11d \ubc0f AI \uac1c\uc120 \uc778\uc0ac\uc774\ud2b8 \ub3c4\ucd9c | \u2022 \uac00\ub3d9\ub960 \uc9d1\uacc4 \ud45c (\uc6b4\uc804\uc2dc\uac04, \ube44\uac00\ub3d9\uc2dc\uac04, \uac00\ub3d9\ub960)<br>\u2022 \ube44\uac00\ub3d9 \uc6d0\uc778 \ud30c\ub808\ud1a0 \uc21c\uc704 \uce74\ub4dc<br>\u2022 AI \uc6d0\uc778 \uc694\uc57d \ubc0f \uac1c\uc120 \uad8c\uace0 \ube0c\ub9ac\ud551 |\n| **FN-EQP-05** | **\uc124\ube44 \uc54c\ub78c \ud1b5\uacc4 \ubc0f \ube48\ubc1c \uc7a5\uc560 \ud328\ud134 \ubd84\uc11d** | \u2022 \uc124\ube44/\ud638\uae30/\uc54c\ub78c\ucf54\ub4dc\ubcc4 \ubc1c\uc0dd \ube48\ub3c4 \ubc0f \uc815\uc9c0 \uc2dc\uac04 \ud1b5\uacc4 \ubd84\uc11d\uc744 \ud1b5\ud55c \ub9cc\uc131 \ubc18\ubcf5 \uc54c\ub78c \ud328\ud134 \uc2dd\ubcc4 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ucd5c\uadfc 24\uc2dc\uac04 \ub3d9\uc548 S/C 1\ud638\uae30 \ubc1c\uc0dd \uc54c\ub78c \ud1b5\uacc4 \ubc0f \ube48\ubc1c \uc5d0\ub7ec \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 \uc54c\ub78c \ub85c\uadf8 API \uc5f0\ub3d9**: \uae30\uac04/\uc124\ube44\ubcc4 \uc54c\ub78c \ubc1c\uc0dd/\ud574\uc81c \ub85c\uadf8 \uc218\uc9d1<br>2. **\uac00\uacf5 \uc5f0\uc0b0**: \uc54c\ub78c\ubcc4 \uc124\ube44 \uc815\uc9c0 \uc18c\uc694 \uc2dc\uac04(\ubd84) \ubc0f \ucd5c\ub2e4 \ube48\ucd9c \uc54c\ub78c \ucf54\ub4dc \uc21c\uc704 \uc9d1\uacc4<br>3. **\ud328\ud134 \ub3c4\ucd9c**: Proc-SLM\uc774 \ubc18\ubcf5\uc131 \uc54c\ub78c \ud328\ud134 \uc694\uc57d \ube0c\ub9ac\ud551 \uc0dd\uc131 | \u2022 \uc54c\ub78c \ud1b5\uacc4 \uc694\uc57d \ud45c (\ubc1c\uc0dd \uac74\uc218, \uc5d0\ub7ec\ucf54\ub4dc, \ucd1d \uc815\uc9c0 \uc2dc\uac04)<br>\u2022 \ube48\ubc1c \uc54c\ub78c \ubd84\uc11d \ube0c\ub9ac\ud551 \uce74\ub4dc |\n\n#### 1.5.3. [\uac00\uce58 3] \uc790\uc7ac \ubc0f \uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-INV-01** | **\uc790\uc7ac \uc720\ud6a8\uae30\uac04 \ubc0f FIFO \uc704\ubc18 \uc774\uc0c1 \ud0d0\uc0c9** | \u2022 \uc790\uc7ac \ucc3d\uace0 \uad6c\uc5ed\ubcc4 \uc120\uc785\uc120\ucd9c(FIFO) \uc704\ubc18 \uac80\ucd9c \ubc0f \uc720\ud6a8\uae30\uac04(D-day) \uc784\ubc15 \uc790\uc7ac \uc774\uc0c1 \ucd94\uc801\u00b7\uacbd\uace0 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc6d0\uc790\uc7ac 2\ucc3d\uace0 \uc720\ud6a8\uae30\uac04 3\uc77c \uc774\ub0b4 \uc790\uc7ac \ubc0f FIFO \uc704\ubc18 \ubaa9\ub85d \ubcf4\uc5ec\uc918\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 WMS API \ud638\ucd9c**: \uc6d0\uc790\uc7ac \uad6c\uc5ed \uc7ac\uace0 Lot \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uc218\uc2e0<br>2. **\ube44\uad50 \uc5f0\uc0b0**: \uc785\uace0\uc77c\uc2dc \uae30\uc900 FIFO \uc704\ubc18 \uac80\ucd9c \ubc0f \uc720\ud6a8\uae30\uac04 \uc794\uc5ec \uc77c\uc218(D-day) \uacc4\uc0b0<br>3. **Proc-SLM**: \uc704\ud5d8\ub3c4 \uc21c \uc815\ub82c \ubc0f \uacbd\uace0 \ud3ec\ub9f7\ud305 | \u2022 \uc790\uc7ac Lot\ubcc4 \ud604\ud669 \ud45c (\uc785\uace0\uc77c, D-day, \uc801\uc7ac \ub799 \ubc88\ud638)<br>\u2022 FIFO \uc704\ubc18 \uacbd\uace0 \ubc30\ub108 |\n| **FN-INV-02** | **\uacf5\uc815 \ubc84\ud37c \uc815\uccb4 \uc9c4\ub2e8 \ubc0f \uccb4\ub958 \uc2dc\uac04 \ubd84\uc11d** | \u2022 \uacf5\uc815 \uac04 \ubc84\ud37c \uc7ac\uace0 \uccb4\ub958 \uc2dc\uac04 \ubd84\uc11d \ubc0f \uae30\uc900 \uc2dc\uac04(\uc608: 45\ubd84) \ucd08\uacfc \uc815\uccb4 \ud488\ubaa9 \uc2dd\ubcc4\u00b7\uc6d0\uc778 \uc9c4\ub2e8 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc\ub41c \uacf5\uc815 \uc7ac\uace0 \ubaa9\ub85d\uacfc \uc815\uccb4 \uc6d0\uc778 \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 MES API \uc5f0\ub3d9**: \uacf5\uc815 \ubc84\ud37c \uc801\uc7ac \ud488\ubaa9 \ubc0f \ud22c\uc785 \uc2dc\uac01 \uc218\uc2e0<br>2. **\uccb4\ub958 \uc2dc\uac04 \uacc4\uc0b0**: \ud604\uc7ac \uc2dc\uac01\uacfc\uc758 \ucc28\uc774 \uc5f0\uc0b0 \u2794 45\ubd84 \ucd08\uacfc(\uc9c0\uc5f0) \ud544\ud130\ub9c1<br>3. **\uacf5 \uc6a9\uae30 \uce74\uc6b4\ud2b8**: \uac00\uc6a9 \ube48 \uce90\ub9ac\uc5b4/\ud314\ub808\ud2b8 \uc218\ub7c9 \ub3d9\uc2dc \uc9d1\uacc4 | \u2022 \uacf5\uc815 \uc7ac\uace0 \uccb4\ub958 \ubd84\uc11d \ud45c (\ud488\ubaa9, \uce90\ub9ac\uc5b4ID, \uccb4\ub958\ubd84, \uc704\uce58)<br>\u2022 \uc8fc\uc758(\ud669\uc0c9)/\uc9c0\uc5f0(\uc801\uc0c9) \uc778\ub514\ucf00\uc774\ud130<br>\u2022 \uacf5 \ud314\ub808\ud2b8/\uc6a9\uae30 \uc794\uc5ec \uc218\ub7c9 \ubc0f \uc815\uccb4 \uc9c4\ub2e8 |\n| **FN-INV-03** | **\uacf5\uc815 \uac04 \ubb3c\ub958 \uc774\uc1a1 \uc9c0\uc5f0 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uce21** | \u2022 \uacf5\uc815 \uac04 \uc774\ub3d9 \uc911\uc778 \ud654\ubb3c\uc758 \uc774\uc1a1 \uc9c0\uc5f0 \ubcd1\ubaa9 \uad6c\uac04 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uc0c1 \uc2dc\uac01 \uc0b0\ucd9c | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uac00\uacf5 1\ub77c\uc778\uc5d0\uc11c \uc870\ub9bd \ub77c\uc778\uc73c\ub85c \uc774\uc1a1 \uc911\uc778 \ubb3c\ub958 \ud604\ud669 \ubc0f \uc9c0\uc5f0 \uc5ec\ubd80\"* ) | 1. **\uc774\uc1a1 \ud2b8\ub798\ud0b9 API \uc5f0\ub3d9**: \uc774\uc1a1 \uc9c0\uc2dc \ud0dc\uc2a4\ud06c \ubc0f \uc6b4\uc1a1 \uc124\ube44(AGV \ud638\uae30) \uc704\uce58 \ucd94\uc801<br>2. **\uc9c0\uc5f0 \uc9c4\ub2e8**: \ud45c\uc900 \uc774\uc1a1 \uc2dc\uac04 \ub300\ube44 \uc9c0\uc5f0 \uad6c\uac04 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uc0c1 \uc2dc\uac01 \uc0b0\ucd9c | \u2022 \uc774\uc1a1 \uc9c4\ub2e8 \uce74\ub4dc (\ud654\ubb3cID, \uc6b4\uc1a1AGV, \uc608\uc0c1\ub3c4\ucc29\uc2dc\uac01, \uc9c0\uc5f0 \uacbd\uace0) |\n\n#### 1.5.4. [\uac00\uce58 4] AI \uc2dc\uc2a4\ud15c \uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c \uc790\ub3d9 \uc81c\uacf5\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-ADV-01** | **\ud45c\uc900 \ub370\uc774\ud130 & \uc815\uae30 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc0dd\uc131** | \u2022 \uc2e0\uaddc/\uac1c\uc870 \uc124\ube44 \ub3c4\uc785 \uc2dc \ud45c\uc900 \ub370\uc774\ud130 \ub9e4\ud551 \ucd94\ucc9c \ubc0f \uc77c/\uc8fc/\uc6d4\uac04 \uc815\uae30 \uc608\ubc29 \ubcf4\uc804(PM) \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc790\ub3d9 \uc791\uc131 | \u2022 \uc0b0\ucd9c\ubb3c \uc694\uccad \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc2e0\uaddc \ub3c4\uc785\ub41c RGV 5\ud638\uae30 \uc8fc\uac04 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc791\uc131\ud574\uc918\"* ) | 1. **\uc9c0\uc2dd \uac80\uc0c9**: \uc720\uc0ac RGV \ubaa8\ub378 \uc815\ube44 \ub9e4\ub274\uc5bc \ubc0f \ud45c\uc900 \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uac80\uc0c9<br>2. **Proc-SLM \uac00\uacf5**: \uc810\uac80 \ubd80\uc704(\uc13c\uc11c, \ubaa8\ud130, \uccb4\uacb0\ubd80), \ubc29\ubc95, \ud310\uc815 \uae30\uc900\uc744 \ud45c\uc900 PM \ud45c \uc591\uc2dd\uc73c\ub85c \uc0dd\uc131 | \u2022 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc591\uc2dd \ud45c (\uc810\uac80 \ubd80\uc704, \ubc29\ubc95, \ud310\uc815 \uae30\uc900, \uc8fc\uae30)<br>\u2022 \ud45c\uc900 \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uc81c\uc548 |\n| **FN-ADV-02** | **\ud14c\uc2a4\ud2b8 / \uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc \uc9c0\uc6d0** | \u2022 \uc2dc\uc2a4\ud15c \ud328\uce58 \ub610\ub294 \uac1c\uc870 \uc2dc \ub2e8\uc704/\ud1b5\ud569 \ud14c\uc2a4\ud2b8 \ucf00\uc774\uc2a4 \ubc0f 5\ub2e8\uacc4 \uc2dc\uc6b4\uc804 \uc808\ucc28\uc11c \ucd08\uc548 \uc790\ub3d9 \uc218\ub9bd | \u2022 \uc0b0\ucd9c\ubb3c \uc694\uccad \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ucee8\ubca0\uc774\uc5b4 PLC \ub85c\uc9c1 \uc218\uc815 \ud6c4 \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uc808\ucc28\uc11c \uc0dd\uc131\"* ) | 1. **\ubcc0\uacbd\uc810 \ubd84\uc11d**: \uc218\uc815 \ub85c\uc9c1 \ub300\uc0c1 \uc124\ube44 \ubc0f \uc778\ud130\ub85d \uc601\ud5a5 \ubc94\uc704 \ub3c4\ucd9c<br>2. **\uc808\ucc28\uc11c \uc0dd\uc131**: 5\ub2e8\uacc4 \uc2dc\uc6b4\uc804 \uc218\uc21c(\uc0ac\uc804 \uc810\uac80 \u2794 \ubb34\ubd80\ud558 \u2794 \ubd80\ud558 \u2794 \ube44\uc0c1\uc815\uc9c0 \u2794 \ucd5c\uc885 \uac80\uc99d) \uc791\uc131 | \u2022 5\ub2e8\uacc4 \uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc \ubb38\uc11c<br>\u2022 \ud14c\uc2a4\ud2b8 \uc2dc\ub098\ub9ac\uc624/\uc0ac\uc804\uc870\uac74/\uae30\ub300\uacb0\uacfc \ud45c |\n| **FN-ADV-03** | **\ube44\uc0c1 \ub300\uc751(BCP) & \uc218\ub3d9 \uc804\ud658 \uac00\uc774\ub4dc** | \u2022 \uc0c1\uc704 \uc2dc\uc2a4\ud15c \ub2e4\uc6b4 \ub610\ub294 \ud1b5\uc2e0 \uc7a5\uc560 \uc2dc \ud604\uc7a5 \uc81c\uc5b4\ubc18 \uc218\ub3d9 \uc6b4\uc804(Manual Override) \uc804\ud658 \uc218\uc21c \ubc0f \ube44\uc0c1 \uc5f0\ub77d\ub9dd \uc548\ub0b4 | \u2022 \uc0b0\ucd9c\ubb3c \uc694\uccad \ud504\ub86c\ud504\ud2b8 (\uc608: *\"WMS \uc11c\ubc84 \ub2e4\uc6b4 \uc2dc \ucc3d\uace0 \uc218\ub3d9 \uc785\ucd9c\uace0 BCP \uc808\ucc28 \uc54c\ub824\uc918\"* ) | 1. **BCP \ud45c\uc900 \uc808\ucc28\uc11c \uac80\uc0c9**: \ube44\uc0c1 \ub300\uc751 \ud45c\uc900 \uc808\ucc28\uc11c \ubc0f \uc218\ub3d9 \uc804\ud658 \uac00\uc774\ub4dc \ud0d0\uc0c9<br>2. **\uc808\ucc28\uc11c \ud3ec\ub9f7\ud305**: \uc218\ub3d9 \uc6b4\uc804 \uc804\ud658 3\ub2e8\uacc4 \uc218\uc21c, \uc548\uc804 \ud655\uc778 \uccb4\ud06c\ub9ac\uc2a4\ud2b8, \ube44\uc0c1 \ud56b\ub77c\uc778 \uc548\ub0b4\uc11c \ucd9c\ub825 | \u2022 BCP \ube44\uc0c1 \uc808\ucc28\uc11c (\uc218\ub3d9 \uc804\ud658 3\ub2e8\uacc4, \uc548\uc804 \ud655\uc778 \ud56d\ubaa9, \ube44\uc0c1 \uc5f0\ub77d\ub9dd) |\n\n---\n\n### 1.6. \ud50c\ub7ab\ud3fc \uae30\ubc18 \ud3b8\uc758 \uae30\ub2a5: \uac1c\uc778\ud654 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 (Platform Enabler)\n\n\ud604\uc7a5 \uc5d4\uc9c0\ub2c8\uc5b4 \ubc0f \uad00\ub9ac\uc790\uac00 4\ub300 \ud575\uc2ec \uac00\uce58\ub97c \uc0ac\uc6a9\ud560 \ub54c \ub9e4\ubc88 \ubb38\uc11c\ub97c \ucca8\ubd80\ud558\ub294 \ubc88\uac70\ub85c\uc6c0\uc744 \uc5c6\uc560\uace0 \uac80\uc0c9 \uc815\ud655\ub3c4\ub97c \uadf9\ub300\ud654\ud558\uae30 \uc704\ud574 \ub2e4\uc74c **\uc9c0\uc2dd \uad00\ub9ac \ud50c\ub7ab\ud3fc \uae30\ub2a5**\uc744 \uae30\ubcf8 \ud0d1\uc7ac\ud569\ub2c8\ub2e4.\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-PWS-01** | **\uac1c\uc778 / \ud300\ubcc4 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4** | \u2022 \uac1c\uc778/\uc791\uc5c5\ubc18 \ub2e8\uc704\ub85c \ud504\ub85c\uc81d\ud2b8 \uacf5\uac04\uc744 \uc0dd\uc131\ud558\uace0 \uc790\uc8fc \ucc38\uc870\ud558\ub294 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74\uc744 \uc601\uad6c \ubcf4\uad00\ud558\uc5ec \uc138\uc158 \ucd08\uc6d4 \uc7ac\ucc38\uc870 \uc9c0\uc6d0 | \u2022 \ud504\ub85c\uc81d\ud2b8 \uc0dd\uc131 \uba85\ub839, \ub9e4\ub274\uc5bc/\ub3c4\uba74 \ud30c\uc77c \uc5c5\ub85c\ub4dc | 1. **\ub3c5\ub9bd \ub124\uc784\uc2a4\ud398\uc774\uc2a4 \uc0dd\uc131**: \uac1c\uc778/\ud300 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \uc2dd\ubcc4\uc790(ID) \ubd80\uc5ec<br>2. **\uc804\uc6a9 \uc778\ub371\uc2f1**: \uc5c5\ub85c\ub4dc\ub41c \ubb38\uc11c\ub97c \ud574\ub2f9 \ub124\uc784\uc2a4\ud398\uc774\uc2a4 \uc804\uc6a9 Vector DB\uc5d0 \ud30c\uc2f1 \ubc0f \uc800\uc7a5 | \u2022 \ud504\ub85c\uc81d\ud2b8 \uc9c0\uc2dd \uc800\uc7a5\uc18c \uad00\ub9ac \ud328\ub110<br>\u2022 \uc5c5\ub85c\ub4dc \ubb38\uc11c \uc778\ub371\uc2a4 \ubaa9\ub85d |\n| **FN-PWS-02** | **\ud504\ub85c\uc81d\ud2b8 \uc804\uc6a9 \ub9e4\ub274\uc5bc \ub9de\ucda4 \uac80\uc0c9** | \u2022 \uc804\uccb4 \uacf5\uc7a5 DB \ub300\uc2e0 \ud604\uc7ac \ud65c\uc131\ud654\ub41c \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \ub0b4 \ubb38\uc11c\ub85c\ub9cc \uac80\uc0c9 \ubc94\uc704\ub97c \ud55c\uc815\ud558\uc5ec \ub2f5\ubcc0 \uc815\ud655\ub3c4 \uadf9\ub300\ud654 | \u2022 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \ud65c\uc131\ud654 \ud1a0\uae00 + \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 | 1. **\uac80\uc0c9 \ubc94\uc704 \ud55c\uc815**: \uc9c0\uc815\ub41c \ud504\ub85c\uc81d\ud2b8 \ub124\uc784\uc2a4\ud398\uc774\uc2a4 \ubb38\uc11c\ub85c\ub9cc \uac80\uc0c9 \ub300\uc0c1 \ud55c\uc815<br>2. **\ub9de\ucda4\ud615 \ub2f5\ubcc0 \uc0dd\uc131**: \ud0c0 \uc124\ube44 \ub9e4\ub274\uc5bc \ud63c\uc120\uc774 \uc6d0\ucc9c \ucc28\ub2e8\ub41c \uace0\uc815\ubc00 \ub9de\ucda4\ud615 \uac00\uc774\ub4dc \uc81c\uacf5 | \u2022 \ud504\ub85c\uc81d\ud2b8 \ud55c\uc815 \ub9de\ucda4\ud615 \uc815\ubc00 \ub2f5\ubcc0<br>\u2022 \uc804\uc6a9 \ubb38\uc11c \ucd9c\ucc98 \uc778\ub371\uc2a4 |\n\n---\n\n### 1.7. \uc5d0\uc774\uc804\ud2b8 \uc6b4\uc601 \uc6d0\uce59 \ubc0f \uc81c\uc57d\uc0ac\ud56d\n- **Chat-First AI Agent \ubcf8\uc9c8 \ubc0f \ubdf0\uc5b4/\ub300\uc2dc\ubcf4\ub4dc \ubc30\uc81c \uc6d0\uce59**:\n  - \ubcf8 \uc2dc\uc2a4\ud15c\uc740 \uc2e4\uc2dc\uac04 \uc124\ube44 \ubaa8\ub2c8\ud130\ub9c1\uc744 \uc704\ud55c SCADA \ud654\uba74, \uadf8\ub798\ud53d \ud1a0\ud3f4\ub85c\uc9c0 \ub9f5, \ub300\ud615 \ub370\uc774\ud130 \ubdf0\uc5b4\uac00 \uc544\ub2d9\ub2c8\ub2e4.\n  - \uc0c1\uc2dc \uac10\uc2dc \ubc0f \uc6d0\uc2dc \ub370\uc774\ud130 \ud45c\ucd9c\uc740 \uae30\uc874 \uad00\uc81c/SCADA \uc2dc\uc2a4\ud15c\uc758 \uc5ed\ud560\uc774\uba70, AI Agent\ub294 **\ub300\ud654\ud615 \uc778\ud130\ud398\uc774\uc2a4(Chat UI)\ub97c \ud1b5\ud574 \uc0ac\uc6a9\uc790\uc758 \ud504\ub86c\ud504\ud2b8\uc5d0 \ub2f5\ubcc0\ud558\uace0, \ubb38\uc81c\uc758 \uc6d0\uc778\uc744 \uc9c4\ub2e8\ud558\uba70, \ud1b5\uacc4\ub97c \ubd84\uc11d\ud558\uace0, \uc6b4\uc601 \uc0b0\ucd9c\ubb3c\uc744 \uc790\ub3d9 \uc0dd\uc131\ud558\ub294 \uc9c0\ub2a5\ud615 \uc9c0\uc6d0 \ub3c4\uad6c**\uc785\ub2c8\ub2e4.\n- **\uc0c1\ud638\uc791\uc6a9 \uccb4\uacc4**: \uc5d0\uc774\uc804\ud2b8\ub294 SLM\uacfc \uc0c1\ud638\uc791\uc6a9\ud558\uc5ec \uc0ac\uc6a9\uc790\uc758 \uc9c8\uc758\uc5d0 \ub2f5\ubcc0\uc744 \uc81c\uacf5\ud558\uace0, \uc9c0\uc2dd \ud0d0\uc0c9 \ubc0f \uc0b0\ucd9c\ubb3c \uc0dd\uc131\uc744 \uc9c0\uc6d0\ud568\n- **\ub370\uc774\ud130 \uc9c1\uc811 \uc811\uadfc \ucc28\ub2e8 \uc6d0\uce59**: \uc5d0\uc774\uc804\ud2b8\ub294 \ud604\uc7a5 \uc81c\uc5b4\ubc18(PLC)\uc774\ub098 \uc6d0\uc2dc DB\uc5d0 \uc9c1\uc811 \uc811\uadfc\ud558\ub294 \uac83\uc744 \uc5c4\uaca9\ud788 \uae08\uc9c0\ud558\uba70, \ubc1c\uc8fc\uc0ac\uc640 \uc57d\uc18d\ub41c \uc911\uacc4 \uc11c\ubc84 \uc778\ud130\ud398\uc774\uc2a4 REST API\ub97c \ud1b5\ud574\uc11c\ub9cc \uc548\uc804\ud558\uac8c \ub370\uc774\ud130\ub97c \uc870\ud68c\ud568\n- **TAG (Text-to-SQL) \uc704\ud5d8\uc131 \ucc28\ub2e8 \uc6d0\uce59**: \n  - SLM\uc774 \uc784\uc758\uc758 DB Query(TAG)\ub97c \uc9c1\uc811 \uc0dd\uc131\ud558\ub294 \ubc29\uc2dd\uc744 \uc5c4\uaca9\ud788 \uae08\uc9c0\ud568 (\uc219\ub828\uc790\ub3c4 \uc5b4\ub824\uc6b4 \ubcf5\uc7a1\ud55c \ub808\uac70\uc2dc \ub2e4\uc911 \ud14c\uc774\ube14 \ucffc\ub9ac \uc0dd\uc131 \uc2dc \uc624\uc791\ub3d9 \ubc0f DB \uacfc\ubd80\ud558 \uc704\ud5d8 \ucc28\ub2e8)\n  - \uac80\uc99d\ub41c \uc911\uacc4 \uc11c\ubc84 \uc778\ud130\ud398\uc774\uc2a4 \ubc94\uc8fc \ub0b4\ub85c SLM\uc758 \uc5ed\ud560\uc744 \uc81c\uc57d\ud558\uc5ec \uc2dc\uc2a4\ud15c \uc548\uc815\uc131\uc744 \ud655\ubcf4\ud558\uace0, \uc815\ud615\ud654\ub418\uc5b4 \uc804\ub2ec\ubc1b\uc740 \ub370\uc774\ud130\uc758 \uc790\uc5f0\uc5b4 \uc694\uc57d \ubc0f \ud45c \ud615\uc2dd \uac00\uacf5 \ud45c\ud604\uc5d0 \uc9d1\uc911\ud568\n- **\ud658\uac01 \uc5b5\uc81c \ubc0f \uadf8\ub77c\uc6b4\ub529(Grounding) \uc6d0\uce59 (AI Agent \uae30\ubcf8 \uc0ac\uc591)**: \n  - \uc751\ub2f5 \ub0b4\uc6a9\uc740 \uc9c0\uc2dd \uac80\uc0c9\ub41c \uc6d0\ubb38 \uadfc\uac70\uc5d0 \ud55c\uc815\ud558\uba70 \uc6d0\ucd9c\ucc98(\ubb38\uc11c\uba85, \ud398\uc774\uc9c0)\ub97c \uba85\uc2dc\ud568\n  - \uac80\uc0c9 \uadfc\uac70\uac00 \uc5c6\uac70\ub098 \uc2e0\ub8b0\ub3c4 \uc810\uc218(\uae30\uc900\uac12 0.70) \ubbf8\ub9cc \uc2dc \ucd94\uc815 \ub2f5\ubcc0\uc744 \uc790\ub3d9 \ucc28\ub2e8\ud558\uace0 \ud6c4\uc18d \uc218\ub3d9 \uc810\uac80 \uac00\uc774\ub4dc\ub97c \uc548\ub0b4\ud568\n- **\uc9d1\uacc4 \ubcf4\uace0 \ubc0f \ud1b5\uacc4 \ud45c\ucd9c \ubc29\uc2dd \uc81c\uc57d**: \uc124\ube44 \uac00\ub3d9\ub960, \uc54c\ub78c \ud1b5\uacc4 \ub4f1\uc758 \uc9d1\uacc4 \ubcf4\uace0\ub294 \ubcc4\ub3c4\uc758 \uace0\uc815\ud615 \uad00\uc81c \ub300\uc2dc\ubcf4\ub4dc \ud654\uba74\uc744 \uc2e0\uaddc \uad6c\ucd95\ud558\ub294 \uac83\uc774 \uc544\ub2c8\ub77c, \uc0ac\uc6a9\uc790\uc758 \uc790\uc5f0\uc5b4 \uc9c8\uc758\uc5d0 \ub530\ub77c **\ub300\ud654\ud615 \ud53c\ub4dc\ubc31 \ud328\ub110(Chat UI) \ub0b4\uc5d0\uc11c \uc778\ub77c\uc778 \ub3d9\uc801 \ud45c(Dynamic Table) \ubc0f \uc694\uc57d \uce74\ub4dc \ud615\ud0dc**\ub85c \ub80c\ub354\ub9c1\ud558\uc5ec \uc81c\uacf5\ud568\n- **\uc81c\uacf5 \uc778\ud130\ud398\uc774\uc2a4**: \uc0ac\uc6a9\uc790\uac00 \ud504\ub86c\ud504\ud2b8\ub97c \uc791\uc131\u00b7\uc0dd\uc131\ud560 \uc218 \uc788\ub294 \ucc44\ud305 \uc778\ud130\ud398\uc774\uc2a4, \uc751\ub2f5 \uacb0\uacfc\ub97c \uc989\uc2dc \ud655\uc778\ud558\ub294 \ud53c\ub4dc\ubc31 \ud654\uba74, \ud504\ub86c\ud504\ud2b8 \uc0dd\uc131 \ubc0f \ucc98\ub9ac \uc774\ub825\uc744 \uc870\ud68c\u00b7\uac80\uc0c9\ud560 \uc218 \uc788\ub294 \ud788\uc2a4\ud1a0\ub9ac UI\ub97c \uc81c\uacf5\ud568\n\n---\n\n## 2. \uc8fc\uc694 \uc0ac\uc6a9\uc790 \uc2dc\ub098\ub9ac\uc624 (User Scenario)\n\n### 2.1. \uba54\uc778 \uc720\uc800 \uc800\ub2c8 (Core User Journey)\n\n#### 2.1.1. \uc124\ube44 \uc54c\ub78c \ud0d0\uc9c0 \u2794 SOP \ud0d0\uc0c9 \u2794 \ud604\uc7a5 \uc810\uac80 \uc218\uc21c \uac00\uc774\ub4dc \ud655\uc778\n- **\uac1c\uc694**: \ud604\uc7a5 \uc774\uc1a1 \uc124\ube44(AGV, S/C \ub4f1) \uc7a5\uc560 \uc54c\ub78c \ubc1c\uc0dd \uc2dc \uc790\uc5f0\uc5b4\ub85c SOP\ub97c \uc870\ud68c\ud558\uc5ec \uc2e0\uc18d\ud558\uac8c 1~N\ub2e8\uacc4 \ud604\uc7a5 \uc810\uac80 \uc218\uc21c\uc744 \ud655\uc778\ud558\ub294 \ud575\uc2ec \uc131\uacf5 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. **\uc54c\ub78c \ud0d0\uc9c0 \ubc0f SOP \uc9c8\uc758**: AGV 3\ud638\uae30 \ub77c\uc778 \uc774\ud0c8 \uc54c\ub78c \ubc1c\uc0dd(AGV-ERR-104) \u2794 \uc0ac\uc6a9\uc790\uac00 *\"AGV 3\ubc88 \ub77c\uc778 \uc774\ud0c8 \uc54c\ub78c \uc870\uce58 SOP \ubc0f \ubd80\ud488 \uad50\uccb4 \ub9e4\ub274\uc5bc \uc54c\ub824\uc918\"* \uc785\ub825\n  2. **\uc9c0\uc2dd \uac00\uc774\ub4dc \ud53c\ub4dc\ubc31**: Clas-SLM \ubc0f \uc9c0\uc2dd \uac80\uc0c9 \uae30\ubc18\uc73c\ub85c 1~2\ub2e8\uacc4 \ud604\uc7a5 \uc870\uce58 \uc218\uc21c(\uc704\uce58 \uc13c\uc11c \uc774\ubb3c\uc9c8 \uc81c\uac70 \u2794 \uc81c\ub85c\uc810 \uc7ac\uc124\uc815) \ubc0f \uad00\ub828 \ub3c4\uba74 \uc778\ub371\uc2a4 \ub9c1\ud06c \ud53c\ub4dc\ubc31 \uc548\ub0b4\n  3. **\ud604\uc7a5 \uc870\uce58 \uc9c4\ud589**: \uc5d4\uc9c0\ub2c8\uc5b4\uac00 \uc81c\uc2dc\ub41c \uc548\uc804 \uc218\uce59 \ubc0f \ub2e8\uacc4\ubcc4 \uc218\uc21c\uc5d0 \ub530\ub77c \ud604\uc7a5 \uc870\uce58 \uc218\ud589\n\n#### 2.1.2. \uba40\ud2f0\ubaa8\ub2ec \ub9e4\ub274\uc5bc(PDF) \ud30c\uc77c \uae30\ubc18 \uace0\uc7a5 \uc6d0\uc778 \ubc0f \uc815\ube44 \uc218\uc21c \ud0d0\uc0c9\n- **\uac1c\uc694**: \uc2e0\uaddc \ubb3c\ub958 \uc124\ube44 \ub3c4\uc785 \ubc0f \ube44\ud45c\uc900 \uc7a5\uc560 \ubc1c\uc0dd \uc2dc PDF \uc815\ube44 \ub9e4\ub274\uc5bc\uc744 \uc5c5\ub85c\ub4dc\ud558\uc5ec \ud575\uc2ec \uc810\uac80 \uc218\uc21c\uc744 \uc790\uc5f0\uc5b4\ub85c \uc2e0\uc18d\ud788 \ud30c\uc545\ud558\ub294 \ud604\uc7a5 \uc9c0\uc6d0 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. **\uba40\ud2f0\ubaa8\ub2ec \ud504\ub86c\ud504\ud2b8 \uc785\ub825**: RGV \uc815\ube44 \ub9e4\ub274\uc5bc PDF(45MB) \ucca8\ubd80 + *\"\ucca8\ubd80\ud55c \ubb38\uc11c\uc5d0\uc11c \uc5d0\ub7ec\ucf54\ub4dc E-203 \uc870\uce58\ubc95 \ucc3e\uc544\uc11c \uc694\uc57d\ud574\uc918\"* \uc785\ub825\n  2. **\ubb38\uc11c \ud30c\uc2f1 \ubc0f \uc9c0\uc2dd \ubd84\uc11d**: \uc5d0\uc774\uc804\ud2b8\uac00 PDF \ud30c\uc77c \ud14d\uc2a4\ud2b8/\ub3c4\ud45c \ud30c\uc2f1 \ud6c4 E-203 \uc6d0\uc778(\uc804\uc555 \uac15\ud558 \ubc0f \uc13c\uc11c \uacb0\uc120 \ubd88\ub7c9) \ud30c\uc545\n  3. **\uc694\uc57d \uc548\ub0b4 \ubc0f \ub9c1\ud06c \uc81c\uacf5**: \uba40\ud2f0\ubbf8\ud130 \uc804\uc555 \uce21\uc815 3\ub2e8\uacc4 \uc218\uc21c \uc694\uc57d \uac00\uc774\ub4dc \ucd9c\ub825 \ubc0f PDF 45\ud398\uc774\uc9c0 \ub3c4\uba74 \uc778\ub371\uc2a4 \ub9c1\ud06c \uc81c\uacf5\n\n#### 2.1.3. [\ucc3d\uace0/\ubb3c\ub958 \uad00\ub9ac\uc790] \uacf5\uc815 \ubc84\ud37c \uccb4\ub958 \uc9c0\uc5f0 \ud0d0\uc9c0 \u2794 \ub300\ud654\ud615 \ubaa9\ub85d \ud655\uc778 \ubc0f \ucd9c\uace0 \uc870\uce58\n- **\uac1c\uc694**: \uacf5\uc815 \uc815\uccb4 \ubc29\uc9c0\ub97c \uc704\ud574 \uccb4\ub958 \uc2dc\uac04 \ucd08\uacfc \ud56d\ubaa9\uc744 \ud0d0\uc0c9\ud558\uace0 \ud45c \ud615\uc2dd\uc73c\ub85c \ubaa9\ub85d\uc744 \ucd9c\ub825\ud558\uc5ec \ube60\ub978 \uc774\uc1a1/\ucd9c\uace0\ub97c \uc720\ub3c4\ud558\ub294 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. **\uccb4\ub958 \uc2dc\uac04 \ucd08\uacfc \uc9c8\uc758**: \ubb3c\ub958 \uad00\ub9ac\uc790\uac00 *\"\ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc\ub41c \uacf5\uc815 \uc7ac\uace0 \ubaa9\ub85d \ubcf4\uc5ec\uc918\"* \uc785\ub825\n  2. **\uc7ac\uace0 \ud0d0\uc0c9 \ubc0f \uc751\ub2f5 \ud45c\ucd9c**: \uc5d0\uc774\uc804\ud2b8\uac00 \uc911\uacc4 \uc11c\ubc84 REST API\ub97c \ud1b5\ud574 MES/WMS DB \uc5f0\ub3d9 \ud6c4 \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc \ud56d\ubaa9 \ud0d0\uc9c0 \u2794 \uc801\uc7ac \ub799 \ubc88\ud638, \uc794\uc5ec \uc720\ud6a8\uc2dc\uac04 \ubc0f \uacbd\uace0 \uc778\ub514\ucf00\uc774\ud130 \ud45c\ucd9c\n  3. **\ubaa9\ub85d \uc548\ub0b4**: \uc9c0\uc5f0 \uc790\uc7ac/\uc7ac\uace0 \uc801\uc7ac \ub799 \uc704\uce58 \ubaa9\ub85d \ud45c\ucd9c \ubc0f \uc774\uc1a1 \uc900\ube44 \uc54c\ub9bc \uc5f0\ub3d9\n\n#### 2.1.4. [\uc6b4\uc601/\ubcf4\uc804 \uad00\ub9ac\uc790] \uc2dc\uc2a4\ud15c \ubcc0\uacbd \ubc0f \uc2e0\uaddc \uc124\ube44 \ub3c4\uc785 \uc2dc \uc6b4\uc601 \uc0b0\ucd9c\ubb3c(PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8/\uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc) \uc790\ub3d9 \uc0dd\uc131\n- **\uac1c\uc694**: \uc2e0\uaddc \uc124\ube44 \ub3c4\uc785 \ub610\ub294 \uc2dc\uc2a4\ud15c \ud328\uce58 \uc2dc AI \uc5d0\uc774\uc804\ud2b8\uc5d0\uac8c \uc815\uae30 \uc810\uac80 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \ubc0f \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uc808\ucc28\uc11c \uc791\uc131\uc744 \uc694\uccad\ud558\uc5ec \uc6b4\uc601 \uc900\ube44 \uc2dc\uac04\uc744 \ud68d\uae30\uc801\uc73c\ub85c \ub2e8\ucd95\ud558\ub294 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. **\uc0b0\ucd9c\ubb3c \uc0dd\uc131 \uc694\uccad**: \uc6b4\uc601 \uad00\ub9ac\uc790\uac00 *\"\uc2e0\uaddc \ub3c4\uc785\ub41c RGV 5\ud638\uae30 \uc815\uae30 \uc608\ubc29 \ubcf4\uc804(PM) \uc8fc\uac04 \uccb4\ud06c\ub9ac\uc2a4\ud2b8\ub791 \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uac00\uc774\ub4dc \uc791\uc131\ud574\uc918\"* \ud504\ub86c\ud504\ud2b8 \uc785\ub825\n  2. **\uc9c0\uc2dd \ud0d0\uc0c9 \ubc0f \uac00\uacf5**: Proc-SLM\uc774 \uc720\uc0ac RGV \ud45c\uc900 \ub370\uc774\ud130 \ubc0f \uc815\ube44 \ub9e4\ub274\uc5bc(PDF)\uc744 \uc9c0\uc2dd \ud0d0\uc0c9\ud558\uc5ec PM \ud56d\ubaa9(\uc13c\uc11c \uc774\ubb3c\uc9c8, \ub808\uc77c \ub9c8\ubaa8, \uc804\uc555 \uce21\uc815) \ubc0f \uc2dc\uc6b4\uc804 5\ub2e8\uacc4 \ud14c\uc2a4\ud2b8 \ucf00\uc774\uc2a4 \ub3c4\ucd9c\n  3. **\uc0b0\ucd9c\ubb3c \ud45c\ucd9c \ubc0f \ud65c\uc6a9**: \uc644\uc131\ub41c PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \ubc0f \uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc \uc591\uc2dd\uc744 \ud45c(Table) \ubc0f \ubb38\uc11c \ud615\uc2dd\uc73c\ub85c \ud45c\ucd9c \u2794 \uac80\ud1a0 \ud6c4 \uc815\uc2dd \uc6b4\uc601 \ud45c\uc900 \ubb38\uc11c\ub85c \ub4f1\ub85d\n\n#### 2.1.5. [\ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4] \uac1c\uc778\ud654 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \ub4f1\ub85d \ubc0f \ub9e4\ub274\uc5bc \uc5f0\uc18d \uc9c8\uc758\n- **\uac1c\uc694**: \ub9e4\ubc88 \uc815\ube44 \ub9e4\ub274\uc5bc PDF\ub97c \ubc18\ubcf5 \ucca8\ubd80\ud558\ub294 \ubc88\uac70\ub85c\uc6c0 \uc5c6\uc774, \uac1c\uc778 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4\uc5d0 \uc124\ube44 \ub9e4\ub274\uc5bc\uc744 \uc0ac\uc804 \ub4f1\ub85d\ud558\uc5ec \ub300\ud654 \uc138\uc158\uc774 \ubc14\ub00c\uc5b4\ub3c4 \uc9c0\uc18d\uc801\uc73c\ub85c \ub9de\ucda4\ud615 \uc815\ubc00 \uc9c0\uc2dd\uc744 \ud0d0\uc0c9\ud558\ub294 \uc9c0\uc6d0 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. **\ud504\ub85c\uc81d\ud2b8 \uacf5\uac04 \uc0dd\uc131 \ubc0f \ud30c\uc77c \ub4f1\ub85d**: \uc5d4\uc9c0\ub2c8\uc5b4\uac00 \uac1c\uc778 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4\uc5d0 \"AGV 3\ud638\uae30 \uc804\uc6a9 \uad00\ub9ac \uacf5\uac04\" \ud504\ub85c\uc81d\ud2b8 \uc0dd\uc131 \u2794 \uc815\ube44 \ub3c4\uba74 \ubc0f SOP \ub9e4\ub274\uc5bc PDF \uc5c5\ub85c\ub4dc\n  2. **\uc138\uc158 \ucd08\uc6d4 \uc5f0\uc18d \uc9c8\uc758**: \uc774\ud6c4 \uc138\uc158\uc774 \ubcc0\uacbd\ub418\uac70\ub098 \uc7ac\uc811\uc18d\ud558\ub354\ub77c\ub3c4 \ubb38\uc11c \uc7ac\ucca8\ubd80 \uc5c6\uc774 *\"AGV 3\ud638\uae30 \uc81c\ub85c\uc810 \uc7ac\uc124\uc815 \uc218\uc21c \uc54c\ub824\uc918\"* \ud504\ub86c\ud504\ud2b8 \uc785\ub825 \u2794 \uc0ac\uc804 \ub4f1\ub85d\ub41c \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \uc9c0\uc2dd \uae30\ubc18\uc73c\ub85c \uc989\uc2dc \ub9de\ucda4\ud615 \uc815\ubc00 \ub2f5\ubcc0 \ud53c\ub4dc\ubc31\n\n---\n\n### 2.2. \uc608\uc678 \ubc0f \uc2dc\uc2a4\ud15c \uc548\uc804 \uc2dc\ub098\ub9ac\uc624\n\n#### 2.2.1. \ud504\ub86c\ud504\ud2b8 \ud544\uc218 \uc778\uc790(\uc124\ube44\uba85/\uc54c\ub78c\ucf54\ub4dc) \ub204\ub77d \uc2dc \ub300\ud654\ud615 \uc7ac\ud655\uc778\n- **\uac1c\uc694**: \ud604\uc7a5 \uc791\uc5c5\uc790\uac00 \ubc14\uc05c \ub3c4\uc911 \ub300\uc0c1 \uc124\ube44\uba85\uc774\ub098 \uc778\uc790\ub97c \ub204\ub77d\ud558\uace0 \uc785\ub825\ud588\uc744 \ub54c \ub300\ud654\ud615 \uc778\ud130\ub799\uc158\uc73c\ub85c \uc758\ub3c4\ub97c \uc7ac\ud655\uc778\ud558\ub294 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. \uc0ac\uc6a9\uc790\uac00 *\"\uc54c\ub78c \uc870\uce58\ubc95 \uc54c\ub824\uc918\"* \ud504\ub86c\ud504\ud2b8 \uc785\ub825 (\ub300\uc0c1 \uc124\ube44 \ubc0f \uc54c\ub78c \ucf54\ub4dc \ub204\ub77d)\n  2. Clas-SLM\uc774 \ud544\uc218 \uc778\uc790 \ub204\ub77d \uc2dd\ubcc4 \u2794 \uc5d0\uc774\uc804\ud2b8\uac00 *\"\uc5b4\ub290 \uc124\ube44\uc758 \uc54c\ub78c \uc870\uce58\ubc95\uc744 \uc870\ud68c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c? \ud604\uc7ac \uc54c\ub78c \ubc1c\uc0dd \uc124\ube44: [1] AGV 3\ud638\uae30 [2] S/C 1\ud638\uae30\"* \ub300\ud654\ud615 \uc120\ud0dd \uce69 UI \ucd9c\ub825\n  3. \uc0ac\uc6a9\uc790\uac00 \uc120\ud0dd \uce69 \ud074\ub9ad \ub610\ub294 \ud14d\uc2a4\ud2b8 \ubcf4\uc644 \uc785\ub825 \ud6c4 \uc815\uc0c1\uc801\uc778 \uc9c0\uc2dd \ud0d0\uc0c9 \uc9c4\ud589\n\n#### 2.2.2. \uc911\uacc4 \uc11c\ubc84 \ud1b5\uc2e0 \uc7a5\uc560 \uc2dc \uc0ac\uc6a9\uc790 \uc548\ub0b4\n- **\uac1c\uc694**: \uc911\uacc4 \uc11c\ubc84 REST API \uc751\ub2f5 \uc9c0\uc5f0 \ub610\ub294 \ud1b5\uc2e0 \uc2e4\ud328 \uc2dc \uc624\ub958 \uc0c1\ud669\uc744 \ud22c\uba85\ud558\uac8c \uc548\ub0b4\ud558\uace0 \uc218\ub3d9 \uc810\uac80\uc744 \uc720\ub3c4\ud558\ub294 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. \uc0ac\uc6a9\uc790\uac00 \uc124\ube44 \uac00\ub3d9\ub960 \ub610\ub294 \uacf5\uc815 \uc7ac\uace0 \ud604\ud669 \uc9c8\uc758 \uc785\ub825\n  2. \uc911\uacc4 \uc11c\ubc84 \ud1b5\uc2e0 \ud0c0\uc784\uc544\uc6c3(3\ucd08) \ubc1c\uc0dd\n  3. *\"\uc911\uacc4 \uc11c\ubc84\uc640\uc758 \ud1b5\uc2e0\uc774 \uc6d0\ud65c\ud558\uc9c0 \uc54a\uc544 \uc124\ube44 \uc0c1\ud0dc \ub370\uc774\ud130\ub97c \uac00\uc838\uc62c \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \uc7a0\uc2dc \ud6c4 \ub2e4\uc2dc \uc2dc\ub3c4\ud558\uc2dc\uac70\ub098 \ud604\uc7a5 \uad00\uc81c\uc2e4 \ud654\uba74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.\"* \uc548\ub0b4 \uba54\uc2dc\uc9c0 \ud45c\ucd9c\n\n#### 2.2.3. \uc9c0\uc2dd \uac80\uc0c9 \uadfc\uac70 \ubd80\uc871 \ubc0f \uc720\uc0ac\ub3c4 \ubbf8\ub2ec \uc2dc \ub2f5\ubcc0 \ubd88\uac00 \uc548\ub0b4 (\ud658\uac01 \ucc28\ub2e8)\n- **\uac1c\uc694**: \uc785\ub825\ub41c \uc9c8\uc758\uc5d0 \ub300\ud574 \uc9c0\uc2dd DB \ub0b4 \uadfc\uac70 \ubb38\uc11c\uac00 \uc5c6\uac70\ub098 \uac80\uc0c9 \uc720\uc0ac\ub3c4\uac00 \uae30\uc900\uac12(0.70) \ubbf8\ub9cc\uc77c \ub54c \uc784\uc758 \uc751\ub2f5 \uc0dd\uc131\uc744 \ucc28\ub2e8\ud558\uace0 \ud6c4\uc18d \uc870\uce58\ub97c \uc548\ub0b4\ud558\ub294 \ud750\ub984\n- **\uc8fc\uc694 \ud750\ub984**:\n  1. \uc0ac\uc6a9\uc790\uac00 \ubbf8\ub4f1\ub85d \uc124\ube44 \ub610\ub294 \ubaa8\ud638\ud55c \ud2b9\uc774 \uc7a5\uc560 \uc870\uce58\ubc95 \uc9c8\uc758 \uc785\ub825\n  2. \uc9c0\uc2dd Vector DB \uac80\uc0c9 \uacb0\uacfc \ucd5c\uace0 \uc720\uc0ac\ub3c4\uac00 \uae30\uc900\uac12(0.70) \ubbf8\ub9cc\uc73c\ub85c \uce21\uc815\ub428\n  3. \uc5d0\uc774\uc804\ud2b8\uac00 \ud658\uac01 \ubc29\uc9c0\ub97c \uc704\ud574 \uc751\ub2f5 \uc0dd\uc131\uc744 \uc989\uc2dc \uc911\ub2e8\ud558\uace0 *\"\uad00\ub828 \ubcf4\uc804 SOP \uadfc\uac70\ub97c \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \uc784\uc758\ub85c \ub2f5\ubcc0\ud560 \uc218 \uc5c6\uc73c\ub2c8 \ub9e4\ub274\uc5bc \uc6d0\ubcf8 \ud655\uc778 \ub610\ub294 \ub2f4\ub2f9 \ubd80\uc11c\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.\"* \ub2f5\ubcc0 \ubd88\uac00 \uc0ac\uc2e4 \ubc0f \uc218\ub3d9 \uc810\uac80 \ud6c4\uc18d \uc870\uce58 \uac00\uc774\ub4dc \ud45c\ucd9c\n\n---\n\n### 2.3. \uacf5\ud1b5 UI/UX \uc815\ucc45\n1. **\ud504\ub86c\ud504\ud2b8 \ub300\ud654 \uc7ac\ud655\uc778 \uc815\ucc45**: \ud544\uc218 \uc785\ub825\uac12 \ub204\ub77d \uc2dc \uc5d0\ub7ec\ub97c \ubc49\ub294 \ub300\uc2e0 \uc120\ud0dd \uce69(Chip UI) \ud615\ud0dc\uc758 \ub300\ud654\ud615 \uc7ac\ud655\uc778 \ud504\ub86c\ud504\ud2b8\ub97c \ud45c\ucd9c\ud568\n2. **\uba40\ud2f0\ubaa8\ub2ec \ud30c\uc77c \uc81c\ud55c \uc815\ucc45**: 50MB \ucd08\uacfc \ud30c\uc77c \ub610\ub294 \ubbf8\uc9c0\uc6d0 \ud655\uc7a5\uc790(zip, exe \ub4f1) \ucca8\ubd80 \uc2dc \uc5c5\ub85c\ub4dc \uc2dc\uc810\uc5d0 \uacbd\uace0 \uba54\uc2dc\uc9c0 \ud31d\uc5c5\uc744 \ub744\uc6b0\uace0 \uc785\ub825\uc744 \uc81c\ud55c\ud568\n3. **\ub370\uc774\ud130 \uc870\ud68c \uc548\uc804 \uc815\ucc45**: \uc5d0\uc774\uc804\ud2b8\ub294 PLC/DB \uc9c1\uc811 \uc811\uadfc\uc744 \uc5c4\uaca9\ud788 \ucc28\ub2e8\ud558\uba70, \ubaa8\ub4e0 \uc678\ubd80 \ub370\uc774\ud130\ub294 \uc911\uacc4 \uc11c\ubc84 REST API\ub97c \uac70\uccd0 \uc548\uc804\ud558\uac8c \uc870\ud68c\ud568\n\n---\n\n## 3. \ud504\ub86c\ud504\ud2b8 \ubc0f SLM \ucc98\ub9ac \uccb4\uacc4\n\n### 3.1. \ud504\ub86c\ud504\ud2b8 \uc720\ud615 (Prompt Classification)\n- **\uc9c8\ubb38 \ubc0f \ubd84\uc11d \ud504\ub86c\ud504\ud2b8 (Query & Diagnostics Prompt)**: \ubcf4\uc804 SOP \ub9e4\ub274\uc5bc, \uc124\ube44 \uc131\ub2a5 \ubc0f \uac00\ub3d9\ub960 \ubd84\uc11d, \uc124\ube44 \uc54c\ub78c \ud1b5\uacc4, \uc790\uc7ac/\uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801 \ub4f1 \ub3c4\uba54\uc778 \uc9c0\uc2dd\uacfc \uc6b4\uc601 \ud604\ud669\uc744 \ub300\ud654\ud615\uc73c\ub85c \uc9c8\uc758\ud558\uace0 \ubd84\uc11d\ud558\ub294 \ud504\ub86c\ud504\ud2b8\n- **\uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c \uc0dd\uc131 \ud504\ub86c\ud504\ud2b8 (Artifact Generation Prompt)**: \uc815\uae30 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8, \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uac00\uc774\ub4dc, BCP \uc218\ub3d9 \uc804\ud658 \uc808\ucc28\uc11c \ub4f1 \ud45c\uc900 \uc6b4\uc601 \ubb38\uc11c\ub97c \uc790\ub3d9 \uc0dd\uc131\ud558\ub294 \ud504\ub86c\ud504\ud2b8\n\n### 3.2. \ud504\ub86c\ud504\ud2b8 \ub77c\uc774\ud504 \uc0ac\uc774\ud074 (Prompt Lifecycle)\n- **\u2460 \uc0dd\uc131 (Create)**: \uc0ac\uc6a9\uc790\uac00 \ud14d\uc2a4\ud2b8, \uc74c\uc131 \uc778\uc2dd, \ub610\ub294 \ud30c\uc77c \uc5c5\ub85c\ub4dc(\uba40\ud2f0\ubaa8\ub2ec) \ud615\ud0dc\ub85c \ud504\ub86c\ud504\ud2b8 \uc0dd\uc131\n- **\u2461 \uc2dd\ubcc4 (Identify)**: Clas-SLM\uc774 \ud504\ub86c\ud504\ud2b8\uc758 \uc758\ub3c4 \ubc0f \ub300\uc0c1 \ub3c4\uba54\uc778\uc744 \uc2dd\ubcc4\n- **\u2462 \uacc4\ud68d (Plan)**: Plan-SLM\uc774 \ud504\ub86c\ud504\ud2b8 \uc694\uccad \ucc98\ub9ac\uc5d0 \ud544\uc694\ud55c \uc18c\uc791\uc5c5(Task) \uc21c\uc11c \ubc0f \ud30c\uc774\ud504\ub77c\uc778 \uc218\ub9bd\n- **\u2463 \uc2e4\ud589 (Execute)**: Proc-SLM\uc774 \uacc4\ud68d\ub41c \uc18c\uc791\uc5c5\uc744 \uc21c\ucc28 \uc2e4\ud589\ud558\uace0, \uc911\uacc4 \uc11c\ubc84 REST API \uc5f0\ub3d9 \ub610\ub294 \uc9c0\uc2dd \ud0d0\uc0c9 \uc218\ud589\n- **\u2464 \ud53c\ub4dc\ubc31 \ud45c\ucd9c \ubc0f \ubcf4\uad00 (Finalize)**: \ub300\ud654\ucc3d \ub0b4 \ub3d9\uc801 \ud45c(Table), \uc694\uc57d \uce74\ub4dc, \ubb38\uc11c \ud615\uc2dd\uc73c\ub85c \ud53c\ub4dc\ubc31\uc744 \ud45c\ucd9c\ud558\uace0 \ub300\ud654 \uc774\ub825 \uc800\uc7a5\n\n#### 3.2.1. \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uacfc\uc815 \ub2e4\uc774\uc5b4\uadf8\ub7a8 (Prompt Processing Diagram)\n\n```mermaid\nflowchart LR\n    Step1[\"\u2460 \ud504\ub86c\ud504\ud2b8 \uc0dd\uc131 (Create)<br/>\u2022 \ud14d\uc2a4\ud2b8 \uc785\ub825<br/>\u2022 \uc74c\uc131 \uc778\uc2dd (STT \uac80\ud1a0)<br/>\u2022 \uba40\ud2f0\ubaa8\ub2ec \ud30c\uc77c (PDF)\"] \n    --> Step2[\"\u2461 \uc758\ub3c4 \uc2dd\ubcc4 (Identify)<br/>\u2022 Clas-SLM<br/>\u2022 \uc9c8\uc758 \uc758\ub3c4 \ubd84\ub958<br/>\u2022 \ub3c4\uba54\uc778 \ub9e4\ud551\"]\n    --> Step3[\"\u2462 \ud30c\uc774\ud504\ub77c\uc778 \uacc4\ud68d (Plan)<br/>\u2022 Plan-SLM<br/>\u2022 \uc138\ubd80 Task \ubd84\ud574<br/>\u2022 \ub9e4\uac1c\ubcc0\uc218(JSON) \ucd94\ucd9c\"]\n    --> Step4[\"\u2463 \uba85\ub839 \uc2e4\ud589 & \uac80\uc99d (Execute)<br/>\u2022 Proc-SLM & \uc9c0\uc2dd \uac80\uc0c9<br/>\u2022 Grounding \uc720\uc0ac\ub3c4 \uac80\uc99d<br/>\u2022 \uc911\uacc4 \uc11c\ubc84 REST API\"]\n    --> Step5[\"\u2464 \ud53c\ub4dc\ubc31 \ud45c\ucd9c (Finalize)<br/>\u2022 \ucd9c\ucc98 \ud45c\uc2dc & \ub3d9\uc801 \ud45c(Table)<br/>\u2022 \uc694\uc57d \uce74\ub4dc & \ub300\ud654 \uc774\ub825 \uc800\uc7a5\"]\n```\n\n### 3.3. \ud504\ub86c\ud504\ud2b8 \uc0dd\uc131 \ubc0f \uc9c0\uc2dd \uc5f0\ub3d9 \ubc29\uc2dd\n- **\ud14d\uc2a4\ud2b8 \uc785\ub825 UI**: \uc0ac\uc6a9\uc790\uac00 \uc9c1\uc811 \uc6f9/\ucc44\ud305 \uc778\ud130\ud398\uc774\uc2a4\uc5d0\uc11c \uc790\uc5f0\uc5b4 \ud14d\uc2a4\ud2b8\ub97c \uc791\uc131\ud560 \uc218 \uc788\ub294 \uc785\ub825 \ucc3d \uc81c\uacf5\n- **\uc74c\uc131 \uc778\uc2dd (STT) UI**: \ud604\uc7a5 \uc791\uc5c5\uc790\uc758 \uc74c\uc131\uc744 \uc2e4\uc2dc\uac04 \uccad\ucde8\ud558\uc5ec \uc790\uc5f0\uc5b4 \ud14d\uc2a4\ud2b8\ub85c \uc790\ub3d9 \ubcc0\ud658\ud558\ub294 UI\ub97c \uc81c\uacf5\ud558\uba70, \ubcc0\ud658\ub41c \ud14d\uc2a4\ud2b8\ub294 \uc804\uc1a1 \uc804 \uc0ac\uc6a9\uc790\uac00 \uc9c1\uc811 \ud655\uc778\ud558\uace0 \uc218\uc815\ud560 \uc218 \uc788\ub294 \uac80\ud1a0 \ub2e8\uacc4\ub97c \ud3ec\ud568\ud568\n- **\uba40\ud2f0\ubaa8\ub2ec \ud30c\uc77c \ucca8\ubd80 UI**: PC \ub0b4 \uc815\ube44 \ub9e4\ub274\uc5bc, \uc124\ube44 \ub3c4\uba74 \ub4f1 \ud30c\uc77c\uc744 \uc5c5\ub85c\ub4dc\ud558\uc5ec AI \ubd84\uc11d \uc9c0\uc2dd\uc73c\ub85c \ud65c\uc6a9\n  - **\ucca8\ubd80 \uac00\ub2a5 \ud30c\uc77c \uc720\ud615**: docs, ppt, excel, txt, md, png, jpg, pdf\n  - **\ud30c\uc77c \uc6a9\ub7c9 \uc81c\ud55c**: \ud30c\uc77c\ub2f9 \ucd5c\ub300 50MB \uc774\ud558\n- **\uac1c\uc778\ud654 \ud504\ub85c\uc81d\ud2b8 \uc9c0\uc2dd \uc5f0\ub3d9 UI (\ud50c\ub7ab\ud3fc \ud3b8\uc758 \uae30\ub2a5)**: \ub9e4\ubc88 \ud30c\uc77c \ucca8\ubd80\ud560 \ud544\uc694 \uc5c6\uc774 \uc0ac\uc804 \uc0dd\uc131\ub41c \uac1c\uc778/\ud300 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4\ub97c \uc120\ud0dd\ud558\uc5ec \ub9de\ucda4\ud615 \uc9c0\uc2dd \ucc38\uc870 \ubc94\uc704 \uc9c0\uc815\n\n### 3.4. \uc5ed\ud560 \ubd84\ub2f4\ud615 SLM \uad6c\uc870 (Multi-SLM Architecture)\n- **Clas-SLM (Prompt Classification SLM)**: \uc785\ub825\ub41c \ud504\ub86c\ud504\ud2b8\uc758 \uc758\ub3c4 \ubc0f \ub3c4\uba54\uc778\uc744 \uc815\ud655\ud788 \ubd84\ub958\ud558\ub294 \uc804\ub2f4 \ubaa8\ub378\n- **Plan-SLM (Prompt Plan SLM)**: \ubd84\ub958\ub41c \uc694\uccad\uc744 \ud574\uacb0\ud558\uae30 \uc704\ud55c \uc138\ubd80 \uc18c\uc791\uc5c5(Task) \ub3c4\ucd9c \ubc0f \ud638\ucd9c \ud30c\uc774\ud504\ub77c\uc778 \uc218\ub9bd \ubaa8\ub378\n- **Proc-SLM (Prompt Process SLM)**: \uacc4\ud68d\uc5d0 \ub530\ub77c \uc911\uacc4 \uc11c\ubc84 API \ud638\ucd9c, DB \uac80\uc0c9, \uc9c0\uc2dd \ud0d0\uc0c9\uc744 \uc2e4\ud589\ud558\uc5ec \ucd5c\uc885 \uc0b0\ucd9c\ubb3c\uc744 \ub3c4\ucd9c\ud558\ub294 \uc804\ub2f4 \ubaa8\ub378\n\n### 3.5. \uc911\uacc4 \uc11c\ubc84 \uc778\ud130\ud398\uc774\uc2a4 \uc5f0\ub3d9 \uccb4\uacc4\n- **\uae30\ub2a5 \uc81c\uc57d \uae30\ubc18 \uc548\uc815\uc801 \uc5f0\ub3d9 (Constrained Functionality)**:\n  - \ub808\uac70\uc2dc DB\ub97c \ub300\uc0c1\uc73c\ub85c \ud55c \ubb34\uc81c\ud55c TAG(Text-to-SQL) \ubc29\uc2dd\uc740 \uae30\uc220\uc801 \ub09c\uc774\ub3c4\uac00 \uc9c0\ub098\uce58\uac8c \ub192\uace0 DB \uacfc\ubd80\ud558 \uc704\ud5d8\uc744 \ucd08\ub798\ud568\n  - \uc5d0\uc774\uc804\ud2b8\ub294 \uc911\uacc4 \uc11c\ubc84\uac00 \uc815\uc758\ud55c \uac80\uc99d\ub41c \uc870\ud68c \uc778\ud130\ud398\uc774\uc2a4 \ubc94\uc704 \ub0b4\uc5d0\uc11c\ub9cc SLM\uc758 \ub3d9\uc791(Tool Call / Function Calling)\uc744 \uc81c\uc57d\ud558\uc5ec \ucd5c\uace0 \uc218\uc900\uc758 \uc751\ub2f5 \uc815\ud655\ub3c4\uc640 \uc548\uc815\uc131\uc744 \ubcf4\uc7a5\ud568\n  - \uc804\ub2ec\ubc1b\uc740 \ub370\uc774\ud130\ub97c \ub300\ud654\ud615 \uc751\ub2f5, \uc694\uc57d \ub9ac\ud3ec\ud2b8, \ud45c(Table) \ud615\uc2dd \ub4f1 \uc9c1\uad00\uc801\uc778 \ubc29\uc2dd\uc73c\ub85c \uac00\uacf5 \ubc0f \ud45c\ud604\ud568\n- **\uc778\ud130\ud398\uc774\uc2a4 \ud655\uc7a5\uc744 \uace0\ub824\ud55c \ub3d9\uc801 \uad6c\uc870 (Dynamic Extension Architecture)**:\n  - \uc2e0\uaddc \ubb3c\ub958 \uc124\ube44 \ucd94\uac00 \ub610\ub294 \uc911\uacc4 \uc11c\ubc84 REST API \ud655\uc7a5 \uc2dc, SLM \ubaa8\ub378 \uc7ac\ud559\uc2b5(Re-training) \uc5c6\uc774 **\uc778\ud130\ud398\uc774\uc2a4 \ub808\uc9c0\uc2a4\ud2b8\ub9ac(Interface Registry / API Schema)** \ucd94\uac00\ub9cc\uc73c\ub85c \uc989\uc2dc \uc0c8\ub85c\uc6b4 \uae30\ub2a5\uc744 \uc778\uc2dd\ud558\uace0 \uc5f0\ub3d9\ud560 \uc218 \uc788\ub294 \uc720\uc5f0\ud55c \ud30c\uc774\ud504\ub77c\uc778\uc73c\ub85c \uad6c\ud604\ud568\n\n---\n\n## 4. \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n\n### 4.1. \uc124\ube44 \ubcf4\uc804 SOP \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n- **\uc785\ub825 \ud504\ub86c\ud504\ud2b8**: *\"AGV 3\ubc88 \ub77c\uc778 \uc774\ud0c8 \uc54c\ub78c \uc870\uce58 SOP \uc54c\ub824\uc918\"*\n- **Clas-SLM**: \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ud310\ubcc4 (\ub3c4\uba54\uc778: \ubb3c\ub958 \uc124\ube44 \ubcf4\uc804 \uc9c0\uc2dd)\n- **Plan-SLM**: [Task 1: \uc54c\ub78c\ucf54\ub4dc(AGV-ERR-104) \ub9e4\ud551] \u2794 [Task 2: SOP \uc9c0\uc2dd\ubca0\uc774\uc2a4 \uac80\uc0c9] \u2794 [Task 3: \uc751\ub2f5 \uc11c\uc2dd \uac00\uacf5]\n- **Proc-SLM**: SOP \uc9c0\uc2dd \ud0d0\uc0c9 \ud6c4 1~2\ub2e8\uacc4 \uc870\uce58 \uc218\uc21c \ubc0f \uad00\ub828 \ub3c4\uba74 \ub9c1\ud06c \uac00\uc774\ub4dc \ucd9c\ub825\n\n### 4.2. \uba40\ud2f0\ubaa8\ub2ec \ub9e4\ub274\uc5bc \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n- **\uc785\ub825 \ud504\ub86c\ud504\ud2b8**: RGV \uc815\ube44 \ub9e4\ub274\uc5bc(PDF) \ud30c\uc77c \ucca8\ubd80 + *\"\ucca8\ubd80\ud55c \ubb38\uc11c\uc5d0\uc11c \uc5d0\ub7ec\ucf54\ub4dc E-203 \uc870\uce58\ubc95 \ucc3e\uc544\uc11c \uc694\uc57d\ud574\uc918\"*\n- **Clas-SLM**: \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ud310\ubcc4 (\ub3c4\uba54\uc778: \uba40\ud2f0\ubaa8\ub2ec \ub9e4\ub274\uc5bc \uc9c0\uc2dd \ud0d0\uc0c9, \ucca8\ubd80\ud30c\uc77c: PDF 1\uac74)\n- **Plan-SLM**: [Task 1: \uc5c5\ub85c\ub4dc \ubb38\uc11c \ud14d\uc2a4\ud2b8/\ub3c4\ud45c \ud30c\uc2f1] \u2794 [Task 2: \uc5d0\ub7ec\ucf54\ub4dc(E-203) \uc138\ubd80 \uc139\uc158 \uc9c0\uc2dd \uac80\uc0c9] \u2794 [Task 3: \uc6d0\uc778 \ubd84\uc11d \ubc0f \uc810\uac80 \uc218\uc21c \uc694\uc57d \uac00\uacf5]\n- **Proc-SLM**: \ucca8\ubd80 PDF(45\ud398\uc774\uc9c0) \ub0b4 E-203 \uc6d0\uc778 \ud30c\uc2f1 \u2794 \uba40\ud2f0\ubbf8\ud130 \uc804\uc555 \uce21\uc815 3\ub2e8\uacc4 \uc218\uc21c \uc694\uc57d \ucd9c\ub825 \ubc0f \uc6d0\ubcf8 \ud398\uc774\uc9c0 \uc778\ub371\uc2a4 \ub9c1\ud06c \uc81c\uacf5\n\n### 4.3. \uacf5\uc815 \uc7ac\uace0 \ubc0f \ubc84\ud37c \uccb4\ub958 \uc2dc\uac04 \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n- **\uc785\ub825 \ud504\ub86c\ud504\ud2b8**: *\"\ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc\ub41c \uacf5\uc815 \uc7ac\uace0 \ubaa9\ub85d\uacfc \uc9c0\uc5f0 \uc6d0\uc778 \uc54c\ub824\uc918\"*\n- **Clas-SLM**: \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ud310\ubcc4 (\ub3c4\uba54\uc778: \uc790\uc7ac/\uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801 \ubc0f \ubc84\ud37c \uccb4\ub958 \uc2dc\uac04 \ubd84\uc11d)\n- **Plan-SLM**: [Task 1: \uc911\uacc4 \uc11c\ubc84 MES/WMS \uc5f0\ub3d9 \uccb4\ub958 \uc2dc\uac04 \uc870\ud68c] \u2794 [Task 2: \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc \ud56d\ubaa9 \ud544\ud130\ub9c1] \u2794 [Task 3: \uc801\uc7ac \ub799 \uc704\uce58 \ubc0f \uccb4\ub958 \uc2dc\uac04 \ud45c \uc11c\uc2dd \uac00\uacf5]\n- **Proc-SLM**: \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc \uacf5\uc815 \uc7ac\uace0 \ud0d0\uc9c0 \u2794 \uc801\uc7ac \ub799 \ubc88\ud638, \uccb4\ub958 \uc2dc\uac04 \ubaa9\ub85d\uc744 \ub300\ud654\ucc3d\uc5d0 \ud45c(Table) \ud615\uc2dd\uc73c\ub85c \ud45c\ucd9c\n\n### 4.4. \uc124\ube44 \uc54c\ub78c \ud1b5\uacc4 \ubc0f \uac00\ub3d9\ub960 \ubd84\uc11d \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n- **\uc785\ub825 \ud504\ub86c\ud504\ud2b8**: *\"\ucd5c\uadfc 24\uc2dc\uac04 \ub3d9\uc548 S/C 1\ud638\uae30 \ubc1c\uc0dd \uc54c\ub78c \ud1b5\uacc4 \ubc0f \uac00\ub3d9\ub960 \ub9ac\ud3ec\ud2b8 \uc791\uc131\ud574\uc918\"*\n- **Clas-SLM**: \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ud310\ubcc4 (\ub3c4\uba54\uc778: \uc124\ube44 \uc131\ub2a5 \ubc0f \uac00\ub3d9\ub960/\uc54c\ub78c \ubd84\uc11d)\n- **Plan-SLM**: [Task 1: \uc911\uacc4 \uc11c\ubc84 \uac00\ub3d9\ub960 \ubc0f \uc54c\ub78c \ub85c\uadf8 API \uc5f0\ub3d9] \u2794 [Task 2: \uc54c\ub78c\ubcc4 \uc815\uc9c0 \uc2dc\uac04 \ubc0f \ube48\ub3c4 \uc9d1\uacc4] \u2794 [Task 3: \uac00\ub3d9\ub960/\uc54c\ub78c \ud1b5\uacc4 \ud45c \ubc0f \uc694\uc57d \ub9ac\ud3ec\ud2b8 \uac00\uacf5]\n- **Proc-SLM**: \uc2dc\uac04\uac00\ub3d9\ub960(%), \ube44\uac00\ub3d9 \uc2dc\uac04(\ubd84), \ucd5c\ub2e4 \ube48\ucd9c \uc54c\ub78c \ucf54\ub4dc \uc21c\uc704 \ud45c \ubc0f \uac1c\uc120 \uad8c\uace0 \uce74\ub4dc \ucd9c\ub825\n\n### 4.5. \uc2dc\uc2a4\ud15c \uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c(PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8/BCP \uc808\ucc28\uc11c) \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ucc98\ub9ac \uc608\uc2dc\n- **\uc785\ub825 \ud504\ub86c\ud504\ud2b8**: *\"AGV \ub77c\uc778 \ud1b5\uc2e0 \uc7a5\uc560 \ubc1c\uc0dd \uc2dc \ud604\uc7a5 \uc218\ub3d9 \uc804\ud658 BCP \uc808\ucc28\uc11c \ubc0f \uc870\uce58 \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc791\uc131\ud574\uc918\"*\n- **Clas-SLM**: \uc9c8\ubb38 \ud504\ub86c\ud504\ud2b8 \ud310\ubcc4 (\ub3c4\uba54\uc778: \uc2dc\uc2a4\ud15c \uc6b4\uc601 \ubc0f \ube44\uc0c1 \ub300\uc751 BCP \uc9c0\uc6d0)\n- **Plan-SLM**: [Task 1: \ud1b5\uc2e0 \uc7a5\uc560 BCP SOP \uc9c0\uc2dd \ud0d0\uc0c9] \u2794 [Task 2: \ud604\uc7a5 \uc218\ub3d9 \uc6b4\uc804(Manual Override) \ub2e8\uacc4 \ub3c4\ucd9c] \u2794 [Task 3: \ube44\uc0c1 \uc5f0\ub77d\ub9dd \ubc0f BCP \uc591\uc2dd \uac00\uacf5]\n- **Proc-SLM**: \ud1b5\uc2e0 \uc7a5\uc560 \uc2dc \uc218\ub3d9 \uc81c\uc5b4\ubc18 \uc804\ud658 3\ub2e8\uacc4 \uc218\uc21c, \uc548\uc804 \ud655\uc778 \ud56d\ubaa9, \ud56b\ub77c\uc778 \uc815\ubcf4\uac00 \ub2f4\uae34 BCP \uac00\uc774\ub4dc\ub77c\uc778 \ud45c\ucd9c\n\n---\n\n## 5. \ube44\uae30\ub2a5\uc801 \uc694\uad6c\uc0ac\ud56d (Non-Functional Requirements)\n\n### 5.1. \uc131\ub2a5 \ubc0f \uc751\ub2f5\uc131 (Performance & Latency)\n- **\uc751\ub2f5 \uc2dc\uac04 (Response Latency)**:\n  - \ub2e8\uc21c \uc9c8\uc758 \ubc0f \uc124\ube44 \uc0c1\ud0dc/\uc54c\ub78c \ud1b5\uacc4 \uc870\ud68c: 2\ucd08 \uc774\ub0b4 \uc751\ub2f5 \ud53c\ub4dc\ubc31\n  - \uc9c0\uc2dd \uae30\ubc18 \uc815\ube44 \ub9e4\ub274\uc5bc/SOP \ud0d0\uc0c9: 4\ucd08 \uc774\ub0b4 \ud53c\ub4dc\ubc31\n  - \uba40\ud2f0\ubaa8\ub2ec \ub300\uc6a9\ub7c9(PDF) \ubb38\uc11c \ud30c\uc2f1 \ubc0f \uc694\uc57d: 6\ucd08 \uc774\ub0b4 \ud53c\ub4dc\ubc31\n  - \uc911\uacc4 \uc11c\ubc84 \uc5f0\ub3d9 \uc678\ubd80 \ub370\uc774\ud130 \uc870\ud68c: 1.5\ucd08 \uc774\ub0b4 \uc5f0\ub3d9 \ubc0f \uacb0\uacfc \uc804\ub2ec\n- **\ub3d9\uc2dc \ucc98\ub9ac \ub2a5\ub825 (Throughput)**: \ub3d9\uc2dc \uc811\uc18d \uc0ac\uc6a9\uc790 \ucd5c\uc18c 50 TPS(Transactions Per Second) \uc774\uc0c1 \ucc98\ub9ac \uc131\ub2a5 \ubcf4\uc7a5\n\n### 5.2. \uac00\uc6a9\uc131 \ubc0f \uc2e0\ub8b0\uc131 (Availability & Reliability)\n- **\uc2dc\uc2a4\ud15c \uac00\uc6a9\uc131**: 24\uc2dc\uac04 \uc5f0\uc18d \uac00\ub3d9\ud558\ub294 \uc81c\uc870\u00b7\ubb3c\ub958 \uacf5\uc815 \ud2b9\uc131\uc744 \uace0\ub824\ud558\uc5ec \uc5f0\uc911 99.9% \uc774\uc0c1 (SLA \uae30\uc900) \uac00\uc6a9\uc131 \ubcf4\uc7a5\n- **\uc7a5\uc560 \uc870\uce58 \ubc0f \uc774\uc911\ud654 (Failover & Redundancy)**:\n  - \uc5d0\uc774\uc804\ud2b8 \uc11c\ubc84 \ubc0f SLM \uc5d4\uc9c4 \uc7a5\uc560 \ubc1c\uc0dd \uc2dc \ub300\uae30(Standby) \uc11c\ubc84\ub85c 30\ucd08 \uc774\ub0b4 \uc790\ub3d9 \uc7a5\uc560 \uc870\uce58(Failover)\n  - \ub124\ud2b8\uc6cc\ud06c \ub2e8\uc120 \ubc1c\uc0dd \uc2dc \uc0ac\uc6a9\uc790 \ud504\ub86c\ud504\ud2b8 \uc7ac\uc804\uc1a1\uc744 \uc704\ud55c Local Queue \ubc84\ud37c\ub9c1 \uc9c0\uc6d0\n\n### 5.3. \ubcf4\uc548 \ubc0f \uc811\uadfc \uc81c\uc5b4 (Security & Access Control)\n- **\uc5ed\ud560 \uae30\ubc18 \uc811\uadfc \uc81c\uc5b4 (RBAC)**:\n  - **User / Operator**: \uc124\ube44/\uc54c\ub78c \ubd84\uc11d \uc9c8\uc758, SOP \ubc0f \ub9e4\ub274\uc5bc \uc9c8\uc758, \uac1c\uc778 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \uad00\ub9ac\n  - **Admin (\uad00\ub9ac\uc790)**: \uc804\uc0ac \uc9c0\uc2dd \uad00\ub9ac, \uc0ac\uc6a9\uc790 \uacc4\uc815 \uc124\uc815, \uc2dc\uc2a4\ud15c \ud5ec\uc2a4 \ubaa8\ub2c8\ud130\ub9c1\n- **\ub370\uc774\ud130 \uc554\ud638\ud654 \ubc0f \ud1b5\uc2e0 \ubcf4\uc548**:\n  - \uc911\uacc4 \uc11c\ubc84 \ubc0f MES/WMS \uc5f0\ub3d9 \uad6c\uac04 TLS 1.3 (HTTPS/WSS) \uc554\ud638\ud654 \ud1b5\uc2e0\n- **\uc138\uc158 \uad00\ub9ac**: \uc77c\uc815 \uc2dc\uac04 \ubb34\uc870\uc791 \uc2dc \uc138\uc158 \uc790\ub3d9 \ub9cc\ub8cc \ubc0f \uc7ac\uc778\uc99d \uc694\uad6c\n\n### 5.4. \ub370\uc774\ud130 \uad00\ub9ac \ubc0f \ubc31\uc5c5 (Data Management & Backup)\n- **\uba40\ud2f0\ubaa8\ub2ec \ud30c\uc77c \uc5c5\ub85c\ub4dc \uc81c\uc57d**:\n  - \uc9c0\uc6d0 \ud3ec\ub9f7: PDF, Office (DOCX, PPTX, XLSX), TXT, MD, \uc774\ubbf8\uc9c0 (PNG, JPG)\n  - \ud30c\uc77c \uc6a9\ub7c9 \uc81c\ud55c: \ud30c\uc77c\ub2f9 \ucd5c\ub300 50MB \uc774\ud558\n- **\ub370\uc774\ud130 \ubc31\uc5c5 \ubc0f \ubcf5\uad6c (Backup & Recovery Policy)**:\n  - \uc815\ud615 \ub370\uc774\ud130(\uacc4\uc815, \ub300\ud654\uc774\ub825, \ud504\ub85c\uc81d\ud2b8 \uc124\uc815): \uc77c 1\ud68c \uc804\uccb4 \ubc31\uc5c5 \ubc0f 15\ubd84 \uc8fc\uae30 \uc99d\ubd84 \ubc31\uc5c5 \uc218\ud589\n  - \uc9c0\uc2dd \ub370\uc774\ud130(SOP, \ub9e4\ub274\uc5bc \uc784\ubca0\ub529): \uc8fc 1\ud68c \uc804\uccb4 \ubc31\uc5c5 \ubc0f \uc9c0\uc2dd \uac31\uc2e0 \uc2dc \uc989\uc2dc \ubc31\uc5c5 \uc218\ud589\n  - \ubcf5\uad6c \ubaa9\ud45c: RPO 15\ubd84 \uc774\ub0b4, RTO 30\ucd08 \uc774\ub0b4(Standby \uc804\ud658) / 4\uc2dc\uac04 \uc774\ub0b4(\ub370\uc774\ud130 \ubcf5\uad6c)\n\n### 5.5. \uc2dc\uc2a4\ud15c \ud655\uc7a5\uc131 \ubc0f \uc720\uc9c0\ubcf4\uc218\uc131 (Scalability & Maintainability)\n- **\ubaa8\ub4c8\ud615 Multi-SLM \uc544\ud0a4\ud14d\ucc98**: Clas-SLM, Plan-SLM, Proc-SLM\uc744 \ucee8\ud14c\uc774\ub108 \uae30\ubc18(Docker/K8s)\uc73c\ub85c \ub3c5\ub9bd \ubd84\ub9ac\ud558\uc5ec \uac1c\ubcc4 \ub85c\ub4dc \ubc38\ub7f0\uc2f1 \ubc0f \uc2a4\ucf00\uc77c \uc544\uc6c3(Scale-out) \uc9c0\uc6d0\n- **\uc124\ube44 \ubc0f API \ud655\uc7a5\uc131**: \uc2e0\uaddc \ubb3c\ub958 \uc124\ube44\ub098 \uc2e0\uaddc \uc911\uacc4 \uc11c\ubc84 \uc870\ud68c API \ucd94\uac00 \uc2dc SLM \uc7ac\ud559\uc2b5 \uc5c6\uc774 \uc124\uc815 \ud30c\uc77c(Configuration) \uc5c5\ub370\uc774\ud2b8\ub9cc\uc73c\ub85c \uc5f0\ub3d9 \ud655\uc7a5 \uac00\ub2a5\n\n### 5.6. \uc0ac\uc6a9\uc790 \uacbd\ud5d8 \ubc0f \uc778\ud130\ud398\uc774\uc2a4 (Usability & UX)\n- **\ub300\ud654\ud615 \uc608\uc678 \ubcf4\uc644 (Clarification UI)**: \ud544\uc218 \uc778\uc790(\uc124\ube44\uba85/\uc54c\ub78c\ucf54\ub4dc) \ub204\ub77d \uc2dc \uc5d0\ub7ec \ubb38\uad6c \ub300\uc2e0 \uc120\ud0dd \uce69(Chip UI) \ud615\ud0dc\uc758 \ub300\ud654\ud615 \uc7ac\ud655\uc778 \ud504\ub86c\ud504\ud2b8 \ud45c\ucd9c\n- **\uba40\ud2f0 \ub514\ubc14\uc774\uc2a4 \uc9c0\uc6d0**: \ud604\uc7a5 \uc5d4\uc9c0\ub2c8\uc5b4 \ud0dc\ube14\ub9bf(Android/iOS) \ubc0f \uad00\uc81c\uc2e4 PC(Chrome/Edge Web Browser) \ucd5c\uc801\ud654 \ubc18\uc751\ud615 UI \uc9c0\uc6d0\n\n### 5.7. \ud658\uac01 \uc5b5\uc81c \ubc0f \uc9c0\uc2dd \ud488\uc9c8 \uad00\ub9ac (Grounding & Quality Maintenance - AI \uae30\ubcf8 \uc0ac\uc591)\n- **\uc6d0\ubb38 \ucd9c\ucc98 \uba85\uc2dc (Citation)**: \uc9c0\uc2dd \uac80\uc0c9 \uae30\ubc18 \uc751\ub2f5 \uc0dd\uc131 \uc2dc \uadfc\uac70\uac00 \ub41c \ubb38\uc11c\uba85, \uac1c\uc815 \ubc84\uc804, \ud574\ub2f9 \ud398\uc774\uc9c0\ub97c \ub2f5\ubcc0 \ud558\ub2e8\uc5d0 \uba85\ud655\ud788 \ud45c\ucd9c\n- **\uc2e0\ub8b0\ub3c4 \uae30\uc900\uac12 \uad00\ub9ac**: \ub2f5\ubcc0 \ubd88\uac00 \ud310\ub2e8\uc5d0 \uc0ac\uc6a9\ub418\ub294 \uc720\uc0ac\ub3c4 \uae30\uc900\uac12(\ucd08\uae30\uac12 0.70)\uc744 \uad00\ub9ac\uc790\uac00 \uc9c8\uc758 \uc720\ud615\ubcc4\ub85c \uc870\uc815 \uac00\ub2a5\n- **\uc9c0\uc2dd \ub178\ud6c4\ud654 \ubc29\uc9c0**: \uc124\ube44 \uac1c\uc870 \ubc0f \uc2e0\uaddc \ub9e4\ub274\uc5bc \ub3c4\uc785 \uc2dc Vector DB \uac31\uc2e0\uc744 \ud1b5\ud574 \ucd5c\uc2e0 \uc9c0\uc2dd \uc6b0\uc120 \ucd94\ucc9c \uc720\uc9c0\n\n---\n\n## 6. \uc678\ubd80 \uc2dc\uc2a4\ud15c \uc5f0\ub3d9 \uc544\ud0a4\ud14d\ucc98 (Integration Specs)\n\n### 6.1. \uc5f0\ub3d9 \uc544\ud0a4\ud14d\ucc98 \ub2e4\uc774\uc5b4\uadf8\ub7a8 (System Architecture Diagram)\n\n```mermaid\ngraph TD\n    subgraph UI_Layer[\"\uc0ac\uc6a9\uc790 \uc778\ud130\ud398\uc774\uc2a4 \ub808\uc774\uc5b4 (Client UI)\"]\n        User[\"\ud604\uc7a5 \ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4<br>\ucc3d\uace0 \uad00\ub9ac\uc790<br>(\uc6f9/\ud0dc\ube14\ub9bf)\"]\n        ChatUI[\"\ucc44\ud305 UI & \uc785\ub825\ud3fc<br>(\ud14d\uc2a4\ud2b8/\uc74c\uc131/\uba40\ud2f0\ubaa8\ub2ec PDF)\"]\n        FeedbackUI[\"\ub300\ud654\ud615 \ud53c\ub4dc\ubc31 UI<br>(\uc790\uc5f0\uc5b4 \uc751\ub2f5, \ub3d9\uc801 \ud45c, \uc694\uc57d \uce74\ub4dc)\"]\n        User --> ChatUI\n        FeedbackUI --> User\n    end\n\n    subgraph Agent_Core[\"[AI \uc5d0\uc774\uc804\ud2b8 Multi-SLM \ucf54\uc5b4 \uc5d4\uc9c4]\"]\n        ClasSLM[\"Clas-SLM (\uc758\ub3c4/\ub3c4\uba54\uc778 \ubd84\ub958)\"]\n        PlanSLM[\"Plan-SLM (\uc18c\uc791\uc5c5 \ud30c\uc774\ud504\ub77c\uc778 \uc218\ub9bd)\"]\n        ProcSLM[\"Proc-SLM (\uc2e4\ud589 \ubc0f \ub370\uc774\ud130 \uac00\uacf5)\"]\n        VectorDB[\"Vector DB (SOP, PDF \ub9e4\ub274\uc5bc, \uc870\uce58\uc774\ub825 \uc9c0\uc2dd)\"]\n        ProjectWS[\"\uac1c\uc778\ud654 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4<br>(\ud50c\ub7ab\ud3fc \uae30\ub2a5)\"]\n        \n        ChatUI --> ClasSLM\n        ClasSLM --> PlanSLM\n        PlanSLM --> ProcSLM\n        ProcSLM <--> VectorDB\n        ProcSLM <--> ProjectWS\n        ProcSLM --> FeedbackUI\n    end\n\n    subgraph Relay_Layer[\"[\ub2e8\uc77c \uc548\uc804 \uc778\ud130\ud398\uc774\uc2a4 : \uc911\uacc4 \uc11c\ubc84]\"]\n        RelayServer[\"\uc911\uacc4 \uc11c\ubc84 (Relay Server - REST API)\"]\n        ProcSLM -- \"\uc678\ubd80 \ub370\uc774\ud130 \uc870\ud68c \uc694\uccad (REST API)\" --> RelayServer\n    end\n\n    subgraph Factory_Systems[\"[\uacf5\uc7a5 \ud604\uc7a5 \uc2dc\uc2a4\ud15c \ub808\uc774\uc5b4 (\uc9c1\uc811\uc811\uadfc \ucc28\ub2e8)]\"]\n        MES_WMS[\"MES / WMS (\uc7ac\uace0, FIFO, \uacf5\uc815 \uc7ac\uace0 \uccb4\ub958 \uc2dc\uac04)\"]\n        SCADA[\"SCADA / \uc124\ube44 \uad00\uc81c DB (\uc124\ube44 \uc0c1\ud0dc, \uac00\ub3d9\ub960, \uc54c\ub78c \ub85c\uadf8)\"]\n        \n        RelayServer -- \"\ub370\uc774\ud130 \uc870\ud68c API / DB View\" --> MES_WMS\n        RelayServer -- \"\uc124\ube44 \uc0c1\ud0dc/\uc54c\ub78c \ub85c\uadf8 \uc218\uc9d1\" --> SCADA\n    end\n```\n\n### 6.2. \uc5f0\ub3d9 \uac1c\uc694\n- \uc5d0\uc774\uc804\ud2b8\ub294 \uacf5\uc7a5 \ub0b4 \ubaa8\ub4e0 \uc678\ubd80 \uc2dc\uc2a4\ud15c(MES, WMS, \uc124\ube44 DB \ub4f1)\uacfc \uc9c1\uc811 \ud1b5\uc2e0\ud558\ub294 \uac83\uc744 \uc5c4\uaca9\ud788 \uae08\uc9c0\ud568\n- **\ubaa8\ub4e0 \uc678\ubd80 \ub370\uc774\ud130 \uc870\ud68c(\uc124\ube44 \uc0c1\ud0dc, \uac00\ub3d9\ub960, \uc7ac\uace0, \uccb4\ub958 \uc2dc\uac04, \uc54c\ub78c \ub85c\uadf8 \ub4f1)\ub294 \ubc18\ub4dc\uc2dc \uc57d\uc18d\ub41c \ub2e8\uc77c \uc811\uc810\uc778 '\uc911\uacc4 \uc11c\ubc84(Relay Server)' REST API \uc778\ud130\ud398\uc774\uc2a4\ub97c \uacbd\uc720\ud568**\n- \uc5d0\uc774\uc804\ud2b8 \ucf54\uc5b4 \ub0b4\ubd80\uc5d0\uc11c\ub294 \ubcf4\uc548\uc0c1 \uad8c\ud55c\uc744 \uac00\uc9c4 \uc804\uc6a9 \uc9c0\uc2dd Vector DB(SOP \ubc0f \uc815\ube44 \ub9e4\ub274\uc5bc)\ub9cc \uc9c1\uc811 \ucc38\uc870\ud568\n\n### 6.3. \uc5f0\ub3d9 \ub300\uc0c1 \ubc0f \ud504\ub85c\ud1a0\ucf5c \uba85\uc138\n| \uc5f0\ub3d9 \uad6c\ubd84 | \uc778\ud130\ud398\uc774\uc2a4 / \ub300\uc0c1 | \uc5f0\ub3d9 \ub370\uc774\ud130 \ubc0f \ubaa9\uc801 | \uc8fc\uc694 \uc5f0\ub3d9 \ud504\ub85c\ud1a0\ucf5c/\ubc29\uc2dd | \ube44\uace0 |\n| :--- | :--- | :--- | :--- | :--- |\n| **\uc5d0\uc774\uc804\ud2b8 \u2194 \uc911\uacc4 \uc11c\ubc84** | **\uc911\uacc4 \uc11c\ubc84 REST API** | \ubaa8\ub4e0 \uc678\ubd80 \uc2dc\uc2a4\ud15c \ub370\uc774\ud130 \uc870\ud68c(\uc124\ube44 \ubd84\uc11d, \uac00\ub3d9\ub960, \uc7ac\uace0 \uc774\uc0c1, \uc54c\ub78c \ud1b5\uacc4 \ub4f1) \ud1b5\ud569 \ud1b5\ub85c | REST API (`/api/v1/relay/*`) | **\uc5d0\uc774\uc804\ud2b8 \uc678\ubd80 \ud1b5\uc2e0 \ub2e8\uc77c \uc811\uc810 (\ubcf4\uc548/\uc548\uc804 \uc218\uce59)** |\n| **\uc5d0\uc774\uc804\ud2b8 \ub0b4\ubd80** | **Vector DB** | \uc124\ube44 \ubcf4\uc804 SOP, \uc815\ube44 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74 \uc9c0\uc2dd \ud0d0\uc0c9 | Vector DB (Embedding Search) | \uc5d0\uc774\uc804\ud2b8 \ub0b4 \uc804\uc6a9 \uc9c0\uc2dd \ud0d0\uc0c9 |\n| **\uc911\uacc4 \uc11c\ubc84 \u2194 \ub808\uac70\uc2dc** | **MES / WMS** | \uc790\uc7ac \uc785\uace0 \uacc4\ud68d, \uc120\uc785\uc120\ucd9c(FIFO) \uc774\uc0c1, \uacf5\uc815 \ubc84\ud37c \uccb4\ub958 \uc2dc\uac04 \ubc0f \uc7ac\uace0 \uc801\uc7ac \ud604\ud669 \uc870\ud68c | REST API / DB View | \uc911\uacc4 \uc11c\ubc84\uc5d0\uc11c \uc870\ud68c \ud6c4 \uc5d0\uc774\uc804\ud2b8\uc5d0 \uc804\ub2ec |\n| **\uc911\uacc4 \uc11c\ubc84 \u2194 \uc124\ube44 \uad00\uc81c** | **SCADA / \uc124\ube44 DB** | \uc124\ube44 \uac00\ub3d9 \uc2e4\uc801, TPH \ucc98\ub9ac\ub7c9, \uc54c\ub78c \ub85c\uadf8 \ub370\uc774\ud130 \uc218\uc9d1 | REST API / DB View | \uc124\ube44 \uc0c1\ud0dc \ub370\uc774\ud130 \uc218\uc9d1 \ubc0f \uac00\uacf5 \uc804\ub2ec |\n\n---\n\n## 7. \uc8fc\uc694 UI/UX \ucef4\ud3ec\ub10c\ud2b8 \uba85\uc138\n\n### 7.1. \ub300\ud654\ud615 \uc778\ud130\ub799\uc158 \ucef4\ud3ec\ub10c\ud2b8\n- **\uc120\ud0dd \uce69 (Option Chip UI)**: \ud504\ub86c\ud504\ud2b8 \ud544\uc218 \uc778\uc790(\uc124\ube44\uba85/\uc54c\ub78c\ucf54\ub4dc) \ub204\ub77d \uc2dc \uc5d0\ub7ec \ud45c\ucd9c \ub300\uc2e0 \ubcf4\uc644 \uc120\ud0dd \ud56d\ubaa9\uc744 \ud074\ub9ad\ud615 \ubc84\ud2bc \uce69\uc73c\ub85c \uc989\uc2dc \uc81c\uacf5\n- **\uba40\ud2f0\ubaa8\ub2ec \ud30c\uc77c \uc5c5\ub85c\ub4dc \ub4dc\ub798\uadf8&\ub4dc\ub86d \uc874**: PDF/Office/\uc774\ubbf8\uc9c0 \ud30c\uc77c \ucca8\ubd80 \uc2dc \ud30c\uc77c\uc6a9\ub7c9 \uac80\uc99d(50MB \uc774\ud558) \ubc0f \ud30c\uc2f1 \uc0c1\ud0dc \uc778\ub514\ucf00\uc774\ud130 \ud45c\uc2dc\n- **\ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \uad00\ub9ac \ucef4\ud3ec\ub10c\ud2b8 (\ud50c\ub7ab\ud3fc \ud3b8\uc758 \uae30\ub2a5)**: \uac1c\uc778/\ud300 \ud504\ub85c\uc81d\ud2b8 \uc0dd\uc131, \ub2f4\ub2f9 \uc124\ube44 \ub9e4\ub274\uc5bc \ubc0f \ub3c4\uba74 \ub4f1\ub85d\u00b7\uad00\ub9ac \ud328\ub110\n\n### 7.2. \ub300\ud654\ud615 \ud53c\ub4dc\ubc31 \ubc0f \ub370\uc774\ud130 \ucef4\ud3ec\ub10c\ud2b8\n- **\ub300\ud654\ud615 \ud14d\uc2a4\ud2b8/\ud45c(Table) \ud53c\ub4dc\ubc31 \uba54\uc2dc\uc9c0 \uc874**: \uc9c8\uc758 \uc751\ub2f5, SOP \uac00\uc774\ub4dc \uc218\uc21c, \uacf5\uc815 \uc7ac\uace0 \uccb4\ub958 \uc2dc\uac04 \ubaa9\ub85d, \uc124\ube44 \uac00\ub3d9\ub960 \ub9ac\ud3ec\ud2b8\ub97c \ub9c8\ud06c\ub2e4\uc6b4 \ud45c \ubc0f \uce74\ub4dc \ud615\uc2dd\uc73c\ub85c \uae54\ub054\ud558\uac8c \uc751\ub2f5\n- **\uc54c\ub78c \ud1b5\uacc4 \uc694\uc57d \uce74\ub4dc**: \uc124\ube44/\ud638\uae30\ubcc4 \uc54c\ub78c \ube48\ub3c4 \ubc0f \uc815\uc9c0 \uc2dc\uac04 \ubd84\uc11d \uacb0\uacfc\ub97c \ub300\ud654\ucc3d \ub0b4\uc5d0\uc11c \uc9c1\uad00\uc801\uc778 \uc694\uc57d \uce74\ub4dc\ub85c \ub80c\ub354\ub9c1\n- **\uc6d0\ubb38 \ucd9c\ucc98 \uc778\ub77c\uc778 \ubc30\ub108 & \ud398\uc774\uc9c0 \ub9c1\ud06c**: \uc9c0\uc2dd \uac80\uc0c9 \uadfc\uac70 \ubb38\uc11c\uba85, \ud398\uc774\uc9c0 \ubc88\ud638 \ubc0f \ucc38\uc870 \ub525\ub9c1\ud06c \ucef4\ud3ec\ub10c\ud2b8\n\n---\n\n## 8. \uc5d0\uc774\uc804\ud2b8 \uc0ac\uc591\n- **SLM Engine**: Google Gemini \uae30\ubc18 \ubaa8\ub4c8\ud615 SLM (Gemini 3.6 Flash \ub4f1)\n\n---\n\n## 9. \ucc38\uace0\n- UI/UX \ud654\uba74, \uc778\ud130\ub799\uc158, \ucc44\ud305 \uc778\ud130\ud398\uc774\uc2a4 \uc138\ubd80 \uc2a4\ud399\uc740 **\ud654\uba74\uc124\uacc4\uc11c** \ucc38\uace0\n- [Factory AI Agent Question List.md](file:///c:/Users/hanwha/Desktop/PIRELLI/Factory%20AI%20Agent%20Question%20List.md)\n- [Factory AI Agent API Specification.md](file:///c:/Users/hanwha/Desktop/PIRELLI/Factory%20AI%20Agent%20API%20Specification.md)\n- [\uc2a4\ub9c8\ud2b8\ud329\ud1a0\ub9ac_\uacf5\uc815_\uad00\uc81c_\ud56d\ubaa9_\uc815\ub9ac_v260318.xlsx](file:///c:/Users/hanwha/Desktop/PIRELLI/%EC%8A%A4%EB%A7%88%ED%8A%B8%ED%8C%A9%ED%86%A0%EB%A6%AC_%EA%
