<script>
const rawMd = "# Factory Operation AI Agent - \ud575\uc2ec \uc81c\uacf5 \uac00\uce58\ubcc4 \uc138\ubd80 \uae30\ub2a5 \uc0c1\uc138 \uba85\uc138\uc11c\n(Detailed Feature Specification by Core Value Proposition)\n\n---\n\n## 0. \ubb38\uc11c \uac1c\uc694 \ubc0f \uac00\uce58 \uccb4\uacc4 (Value Proposition Framework)\n\n\ubcf8 \ubb38\uc11c\ub294 **Factory Operation AI Agent (\uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc6b4\uc601 \ubc0f \ubcf4\uc804 \uc9c0\uc6d0 AI \uc5d0\uc774\uc804\ud2b8)**\uc758 **4\ub300 \ud575\uc2ec \uc81c\uacf5 \uac00\uce58(Core Values)** \ubc0f **\ud50c\ub7ab\ud3fc \uae30\ubc18 \ud3b8\uc758 \uae30\ub2a5(Platform Enabler)**\uc5d0 \ub300\ud55c \uc2ec\uce35\uc801 \uae30\uc220 \uba85\uc138, \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998(HOW), \uadf8\ub9ac\uace0 \ud604\uc7a5 \uc6b4\uc601 \uc2dc\ub098\ub9ac\uc624\ub97c \uc815\uc758\ud569\ub2c8\ub2e4.\n\n\uc81c\uc870\u00b7\ubb3c\ub958 \ud604\uc7a5\uc758 \ud575\uc2ec \ud398\uc778\ud3ec\uc778\ud2b8(\uc124\ube44 \uace0\uc7a5 \uc2dc SOP \ud0d0\uc0c9 \uc9c0\uc5f0, \ubcf5\uc7a1\ud55c SCADA/MES \ub300\uc2dc\ubcf4\ub4dc\ub098 \ub85c\uadf8 \ubdf0\uc5b4\ub97c \uc218\uc791\uc5c5\uc73c\ub85c \ub4a4\uc9c0\ub294 \ubc88\uac70\ub85c\uc6c0, \ubc84\ud37c \uccb4\ub958 \uc9c0\uc5f0\uc73c\ub85c \uc778\ud55c \uc7ac\uace0 \ud488\uc9c8 \ub9ac\uc2a4\ud06c, \uc6b4\uc601 \ud45c\uc900 \ubb38\uc11c \uc218\uc791\uc5c5 \uc791\uc131 \ubd80\ub2f4 \ub4f1)\ub97c \ud574\uc18c\ud558\uace0, \uc790\uc5f0\uc5b4 \ub300\ud654 \ud55c \ubc88\uc73c\ub85c \ud544\uc694\ud55c \ubd84\uc11d \ub370\uc774\ud130\uc640 \uc9c0\uc2dd\uc744 \uc989\uc2dc \uc81c\uacf5\ud558\ub294 **Chat-First \uc9c0\ub2a5\ud654 \uccb4\uacc4**\ub97c \uad6c\ucd95\ud569\ub2c8\ub2e4.\n\n### 0.1. \ud575\uc2ec \uac00\uce58 \uccb4\uacc4\ub3c4 (Core Value Architecture)\n\n```mermaid\nflowchart TB\n    Root([\"<b>Factory Operation AI Agent</b><br/>\uc2a4\ub9c8\ud2b8 \ud329\ud1a0\ub9ac \uc6b4\uc601 \uc9c0\ub2a5\ud654 4\ub300 \ud575\uc2ec \uac00\uce58\"])\n\n    V1[\"<b>(1) \ubcf4\uc804 \uc9c0\uc2dd & SOP \uc548\ub0b4</b><br/>\u2022 \uace0\uc7a5 \uc870\uce58 SOP \uac00\uc774\ub4dc<br/>\u2022 \uc815\ube44/\ubd80\ud488 \ub9e4\ub274\uc5bc \uc9c8\uc758<br/>\u2022 \ud2b8\ub7ec\ube14\uc288\ud305 \uc774\ub825 \ud0d0\uc0c9<br/>\u2022 \uba40\ud2f0\ubaa8\ub2ec PDF \ub3c4\uba74 \uc735\ud569\"]\n    V2[\"<b>(2) \uc124\ube44 \uc131\ub2a5 & \uac00\ub3d9\ub960/\uc54c\ub78c \ubd84\uc11d</b><br/>\u2022 \uc774\uc1a1 \uc124\ube44 \uc774\uc0c1 \uc9c4\ub2e8<br/>\u2022 \ub77c\uc778 \uc131\ub2a5 & \ubcd1\ubaa9 \uc2dd\ubcc4<br/>\u2022 \uc801\uc7ac/\ud22c\uc785 \ud050 \uc815\uccb4 \ubd84\uc11d<br/>\u2022 \uac00\ub3d9\ub960 & \ube44\uac00\ub3d9 \ud30c\ub808\ud1a0<br/>\u2022 \uc54c\ub78c \ud1b5\uacc4 & \ube48\ubc1c \uc7a5\uc560 \ubd84\uc11d\"]\n    V3[\"<b>(3) \uc790\uc7ac & \uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801</b><br/>\u2022 \uc790\uc7ac \ucc3d\uace0 FIFO \uc704\ubc18 \ucd94\uc801<br/>\u2022 \uacf5\uc815 \ubc84\ud37c \uc815\uccb4\uc2dc\uac04 \ubd84\uc11d<br/>\u2022 \ubb3c\ub958 \uc774\uc1a1 \uc9c0\uc5f0 \ud0d0\uc9c0\"]\n    V4[\"<b>(4) \uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c \uc790\ub3d9 \uc81c\uacf5</b><br/>\u2022 PM \uc810\uac80 \uccb4\ud06c\ub9ac\uc2a4\ud2b8<br/>\u2022 5\ub2e8\uacc4 \uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc<br/>\u2022 BCP \uc218\ub3d9 \uc804\ud658 \uc808\ucc28\uc11c\"]\n\n    Plat[\"<b>[\ud50c\ub7ab\ud3fc \uae30\ubc18 \ud3b8\uc758 \uae30\ub2a5 (Platform Enabler)]</b><br/>\u2022 \uac1c\uc778/\ud300\ubcc4 \uc804\uc6a9 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4<br/>\u2022 \ud504\ub85c\uc81d\ud2b8 \uc804\uc6a9 \ub9e4\ub274\uc5bc \ub9de\ucda4 \uac80\uc0c9\"]\n\n    Root --> V1\n    Root --> V2\n    Root --> V3\n    Root --> V4\n    Root -. \"\uc9c0\uc2dd \uad00\ub9ac \uc9c0\uc6d0\" .-> Plat\n\n    classDef rootStyle fill:#1e3a8a,stroke:#38bdf8,stroke-width:2px,color:#ffffff,font-weight:bold;\n    classDef nodeStyle fill:#f8fafc,stroke:#cbd5e1,stroke-width:1.5px,color:#0f172a;\n    classDef platStyle fill:#f1f5f9,stroke:#94a3b8,stroke-dasharray: 5 5,stroke-width:1.5px,color:#334155;\n    class Root rootStyle;\n    class V1,V2,V3,V4 nodeStyle;\n    class Plat platStyle;\n```\n\n---\n\n## 1. [\uac00\uce58 1] \ubb3c\ub958 \uc124\ube44 \ubcf4\uc804 \uc9c0\uc2dd & SOP \ub9e4\ub274\uc5bc \uc548\ub0b4 (Maintenance Knowledge & SOP)\n\n### 1.1. \uac00\uce58 \uac1c\uc694 \ubc0f \ub3c4\uc785 \ubc30\uacbd\n- **\ud604\uc7a5 \ubb38\uc81c\uc810**: \ubb3c\ub958 \uc790\ub3d9\ud654 \uc124\ube44(AGV, RGV, \ucee8\ubca0\uc774\uc5b4, S/C, AS/RS \ub4f1) \uace0\uc7a5 \ubc1c\uc0dd \uc2dc \ubc29\ub300\ud55c \uc0ac\ub0b4 \ud30c\uc77c \uc11c\ubc84\ub098 \uc885\uc774 \ub9e4\ub274\uc5bc\uc744 \uc218\uc791\uc5c5\uc73c\ub85c \uac80\uc0c9\ud574\uc57c \ud558\ubbc0\ub85c \ucd08\ub3d9 \uc870\uce58 \uc2dc\uac04(MTTR)\uc774 \uc9c0\uc5f0\ub428.\n- **\uc81c\uacf5 \uac00\uce58**: \ub2e4\uc911 SLM \ubc0f \uc9c0\uc2dd \uac80\uc0c9 \uae30\ubc18 \uc790\uc5f0\uc5b4 \uc9c8\uc758\uc751\ub2f5\uc744 \ud1b5\ud574 \uc124\ube44 \uc54c\ub78c\uc5d0 \ub300\ud55c \ud45c\uc900 \uc810\uac80 \uc218\uc21c(SOP), \ubd80\ud488 \uaddc\uaca9, \ub3c4\uba74 \uc704\uce58\ub97c \uc218\ucd08 \uc774\ub0b4\uc5d0 \uc815\ud655\ud788 \uc548\ub0b4\ud558\uc5ec \ud604\uc7a5 \uc870\uce58 \uc2dc\uac04\uc744 50% \uc774\uc0c1 \ub2e8\ucd95.\n\n### 1.2. \uc138\ubd80 \uae30\ub2a5 \uba85\uc138\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-SOP-01** | **\uc124\ube44 \uace0\uc7a5 \uc870\uce58 SOP \ub2e8\uacc4\ubcc4 \uac00\uc774\ub4dc** | \u2022 \ubb3c\ub958 \uc124\ube44 \uc54c\ub78c\ucf54\ub4dc \uc785\ub825 \uc2dc 1~N\ub2e8\uacc4 \ud604\uc7a5 \ud45c\uc900 \uc810\uac80 \ubc0f \uc870\uce58 \uc218\uc21c(SOP)\uc744 \uc790\uc5f0\uc5b4\ub85c \ub2e8\uacc4\ubcc4 \uc548\ub0b4<br>\u2022 LOTO(\uc548\uc804 \uc7a0\uae08) \ubc0f \uc804\uc6d0 \ucc28\ub2e8 \ub4f1 \uc548\uc804 \uc218\uce59 \ucd5c\uc6b0\uc120 \uac15\uc870 | \u2022 \uc790\uc5f0\uc5b4 \uc9c8\uc758 (\uc608: *\"AGV 3\ud638\uae30 \ub77c\uc778 \uc774\ud0c8 \uc54c\ub78c(ERR-104) \uc870\uce58 SOP \uc54c\ub824\uc918\"* )<br>\u2022 \uc124\ube44 \ubaa8\ub378\uba85, \uc5d0\ub7ec \ucf54\ub4dc | 1. **Clas-SLM**: \ud504\ub86c\ud504\ud2b8 \uc758\ub3c4(SOP \uc9c8\uc758) \ubc0f \ub300\uc0c1 \uc124\ube44/\uc5d0\ub7ec\ucf54\ub4dc \ucd94\ucd9c<br>2. **Plan-SLM**: SOP \uc9c0\uc2dd DB \uac80\uc0c9 \ucffc\ub9ac \uacc4\ud68d \uc218\ub9bd<br>3. **Proc-SLM**: \uc720\uc0ac\ub3c4 \uae30\ubc18 \uc9c0\uc2dd \uac80\uc0c9 \u2794 \uc548\uc804 \uc218\uce59 \ubc0f 1~N\ub2e8\uacc4 \uc810\uac80 \uccb4\ud06c\ud3ec\uc778\ud2b8 \uc694\uc57d \uac00\uacf5 | \u2022 1~N\ub2e8\uacc4 \uccb4\ud06c\ud3ec\uc778\ud2b8 \uce74\ub4dc<br>\u2022 \uc791\uc5c5 \uc804 \uc548\uc804 \uc720\uc758\uc0ac\ud56d \ubc30\ub108<br>\u2022 \ucc38\uc870 SOP \uc6d0\ubb38 \ucd9c\ucc98 \ubc0f \ud398\uc774\uc9c0 \ub525\ub9c1\ud06c |\n| **FN-SOP-02** | **\uc124\ube44 \uc815\ube44 \ubc0f \uc720\uc9c0\ubcf4\uc218 \ub9e4\ub274\uc5bc \uc9c0\uc6d0** | \u2022 \uc815\uae30 \uc810\uac80 \uc8fc\uae30, \uc18c\ubaa8\ud488/\ubd80\ud488 \uad50\uccb4 \uac00\uc774\ub4dc, \uccb4\uacb0 \ud1a0\ud06c \uae30\uc900, \ubd84\ud574/\uc870\ub9bd \uc218\uc21c \uc9c8\uc758\uc751\ub2f5<br>\u2022 \uc21c\uc815 \ubd80\ud488 \ud488\ubc88(Part Number) \ubc0f \uad8c\uc7a5 \uad50\uccb4 \uc8fc\uae30 \uc81c\uacf5 | \u2022 \ubd80\ud488\uba85, \uc124\ube44 \ubaa8\ub378\uba85 \uc9c8\uc758 (\uc608: *\"S/C \uc640\uc774\uc5b4\ub85c\ud504 \uad8c\uc7a5 \uad50\uccb4 \uc8fc\uae30 \ubc0f \uaddc\uaca9\"* ) | 1. **\uc9c0\uc2dd \uac80\uc0c9 \ud30c\uc774\ud504\ub77c\uc778**: \uc815\ube44 \ub9e4\ub274\uc5bc \ub0b4 \ubd80\ud488 \uc2a4\ud399, \uc815\uae30 \uc810\uac80\ud45c, \ubd84\ud574/\uc870\ub9bd \uc139\uc158 \uccad\ud06c \uac80\uc0c9<br>2. **Proc-SLM**: \ube44\uc815\ud615 \ud14d\uc2a4\ud2b8\uc5d0\uc11c \ud1a0\ud06c \uc218\uce58(N\u00b7m), \uad8c\uc7a5 \uc8fc\uae30, \ud30c\ud2b8 \ubc88\ud638 \uc815\ud615\ud654 \ucd94\ucd9c | \u2022 \ubd80\ud488 \uc815\ube44 \uc2a4\ud399 \ud45c(\ud1a0\ud06c, \uaddc\uaca9, \uc8fc\uae30)<br>\u2022 \ubd84\ud574/\uc870\ub9bd \uc21c\uc11c\ub3c4 \ubc0f \uc8fc\uc758\uc0ac\ud56d |\n| **FN-SOP-03** | **\uace0\uc7a5 \uc870\uce58 \uc774\ub825 \ud0d0\uc0c9 (Troubleshooting)** | \u2022 \uacfc\uac70 \ub3d9\uc885 \uc124\ube44/\uc54c\ub78c \ubc1c\uc0dd \uc0ac\ub840 \ubc0f \ubcf4\uc804 \uc5d4\uc9c0\ub2c8\uc5b4\uc758 \uc2e4\uc81c \uc870\uce58 \uc774\ub825 \uac80\uc0c9\uc744 \ud1b5\ud55c \uc6d0\uc778 \uaddc\uba85 | \u2022 \uc54c\ub78c \ucf54\ub4dc, \uc774\uc0c1 \ud604\uc0c1 \ud14d\uc2a4\ud2b8 (\uc608: *\"RGV \uac10\uc18d \uc774\uc0c1 \ube48\ubc1c \uc6d0\uc778 \ubc0f \uc870\uce58 \uc0ac\ub840\"* ) | 1. **\uc9c0\uc2dd\ubca0\uc774\uc2a4 \ud0d0\uc0c9**: \uacfc\uac70 \ud2b8\ub7ec\ube14\uc288\ud305 \uc774\ub825 \ubc0f \ud2b9\uc774 \uace0\uc7a5 \uc870\uce58 \ub370\uc774\ud130 \uccad\ud06c \uac80\uc0c9<br>2. **\ubd84\uc11d \uc5d4\uc9c4**: \uc6d0\uc778\ubcc4 \ubc1c\uc0dd \ube48\ub3c4 \uc9d1\uacc4 \ubc0f \ud574\uacb0 \uc131\uacf5 \uc0ac\ub840 \uc2a4\ucf54\uc5b4\ub9c1 \ub7ad\ud0b9 \ub3c4\ucd9c | \u2022 \uc720\uc0ac \uc7a5\uc560 Top 3 \uc870\uce58 \uc0ac\ub840 \ubaa9\ub85d<br>\u2022 \uc6d0\uc778\ubcc4 \uc810\uc720\uc728(%) \ud1b5\uacc4 \ud45c |\n| **FN-SOP-04** | **\uba40\ud2f0\ubaa8\ub2ec \ub9e4\ub274\uc5bc \uc9c0\uc2dd \uc735\ud569** | \u2022 \uc0ac\uc6a9\uc790\uac00 \uc5c5\ub85c\ub4dc\ud55c PDF, Office, \ub3c4\uba74 \ud30c\uc77c(\ucd5c\ub300 50MB)\uc744 \uc2e4\uc2dc\uac04 \ud30c\uc2f1\u00b7\uc784\ubca0\ub529\ud558\uc5ec \ubb38\uc11c \ub0b4 \uc138\ubd80 \uc870\uce58\ubc95 \uac80\uc0c9 \ubc0f \uc694\uc57d \uc548\ub0b4 | \u2022 \uc815\ube44 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74 \ud30c\uc77c \ucca8\ubd80 + *\"\ucca8\ubd80\ud55c \ub9e4\ub274\uc5bc\uc5d0\uc11c \uc5d0\ub7ec\ucf54\ub4dc E-203 \uc870\uce58\ubc95 \ucc3e\uc544\uc918\"* | 1. **PDF Parser Engine**: \uc5c5\ub85c\ub4dc \ud30c\uc77c \ud14d\uc2a4\ud2b8/\ud45c/\ub3c4\uba74 OCR \uc2e4\uc2dc\uac04 \ud30c\uc2f1<br>2. **\uc9c0\uc2dd \uc784\ubca0\ub529 \ub9e4\uce6d**: \uc138\uc158 \uc784\ubca0\ub529 \uc0dd\uc131 \ubc0f \uc9c8\uc758 \uc720\uc0ac\ub3c4 \ub9e4\uce6d<br>3. **Proc-SLM**: \uc6d0\ubcf8 \ud398\uc774\uc9c0 \uc88c\ud45c \ubc0f \ud14d\uc2a4\ud2b8 \uc694\uc57d \ub3c4\ucd9c | \u2022 \uc5d0\ub7ec \uc804\uc6a9 \uc870\uce58 \uc694\uc57d\ubb38<br>\u2022 \uc6d0\ubb38 \ud398\uc774\uc9c0 \ucc38\uc870 \ub525\ub9c1\ud06c<br>\u2022 \uad00\ub828 \ubc30\uc120\ub3c4/\ub3c4\uba74 \ucea1\ucc98 \uc601\uc5ed \uc548\ub0b4 |\n\n---\n\n## 2. [\uac00\uce58 2] \ubb3c\ub958 \uc124\ube44 \uc131\ub2a5 \ubc0f \uac00\ub3d9\ub960/\uc54c\ub78c \ubd84\uc11d (Equipment Operating Performance, OEE & Alarm Analytics)\n\n### 2.1. \uac00\uce58 \uac1c\uc694 \ubc0f \ub3c4\uc785 \ubc30\uacbd\n- **\ud604\uc7a5 \ubb38\uc81c\uc810**: \ubb3c\ub958 \uc124\ube44\uc758 \uac00\ub3d9 \uc0c1\ud0dc\ub098 \ubcd1\ubaa9 \uad6c\uac04, \ube44\uac00\ub3d9 \uc6d0\uc778 \ubc0f \ub9cc\uc131 \ube48\ubc1c \uc54c\ub78c\uc744 \ud655\uc778\ud558\uae30 \uc704\ud574 \ubcf5\uc7a1\ud55c SCADA/MES \ub300\uc2dc\ubcf4\ub4dc\ub098 \ub85c\uadf8 \ubdf0\uc5b4\ub97c \ucc3e\uc544 \ud5e4\ub9e4\uc57c \ud568.\n- **\uc81c\uacf5 \uac00\uce58**: \ub300\ud654\ud615 \uc9c8\uc758 \ud55c \ubc88\uc73c\ub85c \uc124\ube44 \uac00\ub3d9 \uc2e4\uc801, \uc2dc\uac04\uac00\ub3d9\ub960(OEE), \uc8fc\uc694 \ube44\uac00\ub3d9 \uc694\uc778 \ubc0f \uc54c\ub78c \ubc1c\uc0dd \ud1b5\uacc4\ub97c \uc989\uc2dc \ucde8\ud569\ud558\uc5ec \ub300\ud654\ucc3d \ub0b4 Markdown \ube44\uad50 \ud45c(Table) \ubc0f \ubd84\uc11d \uce74\ub4dc\ub85c \uc81c\uacf5.\n\n### 2.2. \uc138\ubd80 \uae30\ub2a5 \uba85\uc138\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-EQP-01** | **\ubb3c\ub958 \uc774\uc1a1 \uc124\ube44 \uc774\uc0c1 \uc9c4\ub2e8 \ubc0f \ud604\ud669 \uc9c8\uc758** | \u2022 AGV \ubc0f \ubb34\uc778 \uc9c0\uac8c\ucc28\uc758 \uc6b4\uc804 \ubaa8\ub4dc, \uc800\ubc30\ud130\ub9ac, \uacbd\ub85c \uc774\ud0c8 \ubc0f \uc7a5\uc560 \uc815\uc9c0 \ub4f1 \uc774\uc0c1 \uc0c1\ud0dc \uc9c8\uc758\uc751\ub2f5 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"AGV \uc804\uccb4 \uac00\ub3d9 \uc0c1\ud0dc\uc640 \ubc30\ud130\ub9ac 20% \ubbf8\ub9cc \ucc28\ub7c9 \ubc0f \uc774\uc0c1 \uc0c1\ud0dc \uc870\ud68c\"* ) | 1. **Plan-SLM**: \uc790\uc5f0\uc5b4\uc5d0\uc11c \uc124\ube44 \uadf8\ub8f9(AGV) \ubc0f \ud544\ud130 \uc870\uac74(\ubc30\ud130\ub9ac < 20%, \uc5d0\ub7ec \uc0c1\ud0dc) \ud30c\ub77c\ubbf8\ud130 \ucd94\ucd9c<br>2. **Function Calling**: \uc911\uacc4 \uc11c\ubc84 REST API (`GET /api/v1/relay/agv/status`) \ud638\ucd9c<br>3. **Proc-SLM**: \uc218\uc2e0\ub41c JSON \ub370\uc774\ud130 \uc870\uac74 \ud544\ud130\ub9c1 \ubc0f \uc694\uc57d \uc11c\uc2dd \uac00\uacf5 | \u2022 \uc774\uc1a1 \uc124\ube44 \uc0c1\ud0dc \ud45c (\ud638\uae30, \uc874, \ubc30\ud130\ub9ac, \uc0c1\ud0dc)<br>\u2022 \uc800\ubc30\ud130\ub9ac/\uc774\uc0c1 \uc124\ube44 \uacbd\uace0 \ud558\uc774\ub77c\uc774\ud2b8 |\n| **FN-EQP-02** | **\uc790\ub3d9\ud654 \uc774\uc1a1 \uc2dc\uc2a4\ud15c \ucc98\ub9ac \uc131\ub2a5 \ubc0f \ubcd1\ubaa9 \uc9c4\ub2e8** | \u2022 Sorting C/V, Lifter, Diverter, RGV, Gantry, S/C \ub77c\uc778\ubcc4 \uc2dc\uac04\ub2f9 \ucc98\ub9ac\ub7c9(TPH), \uc0ac\uc774\ud074 \ud0c0\uc784 \ube44\uad50 \ubc0f \ubcd1\ubaa9 \uad6c\uac04 \uc2dd\ubcc4 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ud604\uc7ac AS/RS 1~4\ud638\uae30 S/C \ucc98\ub9ac\ub7c9 \ud3b8\ucc28 \ubc0f \uc18d\ub3c4 \uc800\ud558 \uad6c\uac04 \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 \uc5f0\ub3d9**: \uc124\ube44\ubcc4 \uc2e4\uc801 \ub370\uc774\ud130 \uc218\uc9d1 API \ud638\ucd9c<br>2. **\uc131\ub2a5 \uc5f0\uc0b0**: \ud638\uae30\ubcc4 TPH \ubc0f \ud3c9\uade0 \uc0ac\uc774\ud074 \ud0c0\uc784 \uacc4\uc0b0 \ud6c4 \uc124\uacc4 \uae30\uc900\uce58\uc640 \ud3b8\ucc28 \ube44\uad50<br>3. **Proc-SLM**: \ubcd1\ubaa9 \uad6c\uac04 \uc790\ub3d9 \uc2dd\ubcc4 \ubc0f \ube44\uad50 \uc694\uc57d \ud45c \uc0dd\uc131 | \u2022 \ud638\uae30\ubcc4 TPH, \ud3c9\uade0 \uc0ac\uc774\ud074 \ud0c0\uc784 \ube44\uad50 \ud45c<br>\u2022 \ubcd1\ubaa9/\uc18d\ub3c4 \uc800\ud558 \uad6c\uac04 \uc9c4\ub2e8 \ucf54\uba58\ud2b8 |\n| **FN-EQP-03** | **\uc801\uc7ac/\ud22c\uc785 \uc124\ube44 \uac00\ub3d9 \uc0c1\ud0dc \ubc0f \ud050 \uc815\uccb4 \ubd84\uc11d** | \u2022 \ub85c\ub354/\uc5b8\ub85c\ub354 \uac00\ub3d9 \uc0c1\ud0dc, \ubc84\ud37c \ub300\uae30 \ud050 \uc815\uccb4 \ubc0f \ud22c\uc785 \uc9c0\uc5f0 \uc694\uc778 \ubd84\uc11d | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ud22c\uc785 \ub85c\ub354 3\ubc88 \uac00\ub3d9 \uc0c1\ud0dc \ubc0f \uc794\uc5ec \ud22c\uc785 \ub300\uae30\ub7c9, \uc815\uccb4 \uc5ec\ubd80 \ud655\uc778\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 API \uc5f0\ub3d9**: \ub300\uc0c1 \ub85c\ub354\uc758 PLC \uc811\uc810 \uc0c1\ud0dc\uac12 \ubc0f \ubc84\ud37c \ub300\uae30 \ud050 \ub370\uc774\ud130 \uc218\uc9d1<br>2. **Proc-SLM**: \uc124\ube44 \uc6b4\uc804 \ubaa8\ub4dc(Auto/Manual/Alarm) \ubc0f \ub300\uae30 \ud050 \uacfc\ubd80\ud558 \uc9c4\ub2e8 \uc694\uc57d \uce74\ub4dc \ub80c\ub354\ub9c1 | \u2022 \uc124\ube44 \uc0c1\ud0dc \uc694\uc57d \uce74\ub4dc (\uc0c1\ud0dc, \uc2dc\uac04\ub2f9 \ud22c\uc785 \uc2e4\uc801, \ub300\uae30 \ud050 \uc815\uccb4 \uc9c4\ub2e8) |\n| **FN-EQP-04** | **\uc124\ube44 \uac00\ub3d9\ub960 \ubc0f \ube44\uac00\ub3d9 \uc6d0\uc778 \ubd84\uc11d** | \u2022 \uc77c\uac04/\uc8fc\uac04/\uc6d4\uac04 \uc124\ube44\ubcc4 \uc2dc\uac04\uac00\ub3d9\ub960(OEE) \uc9d1\uacc4 \ubc0f \ube44\uac00\ub3d9 \uc6d0\uc778(\uc124\ube44 \uace0\uc7a5, \uc790\uc7ac \ub300\uae30 \ub4f1) \ube44\uc728 \ubd84\uc11d \ub9ac\ud3ec\ud2b8 \uc0dd\uc131 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc774\ubc88 \uc8fc RGV \ub77c\uc778 \ube44\uac00\ub3d9 \uc6d0\uc778 Top 3 \ubc0f \uac00\ub3d9\ub960 \ub9ac\ud3ec\ud2b8\"* ) | 1. **\ud30c\ub77c\ubbf8\ud130 \ud30c\uc2f1**: \uae30\uac04(\uc8fc\uac04), \uc124\ube44\uad70(RGV) \ucd94\ucd9c<br>2. **\ub370\uc774\ud130 \uc218\uc9d1**: \uc911\uacc4 \uc11c\ubc84 \uac00\ub3d9\ub960/\uc54c\ub78c \ub85c\uadf8 API \uc5f0\ub3d9<br>3. **\ud1b5\uacc4 \ubd84\uc11d**: \uac00\ub3d9/\uc815\uc9c0/\ub300\uae30 \uc2dc\uac04 \uc9d1\uacc4, \ube44\uac00\ub3d9 \uc694\uc778\ubcc4 \ud30c\ub808\ud1a0 \ubd84\uc11d \ubc0f AI \uac1c\uc120 \uc778\uc0ac\uc774\ud2b8 \ub3c4\ucd9c | \u2022 \uac00\ub3d9\ub960 \uc9d1\uacc4 \ud45c (\uc6b4\uc804\uc2dc\uac04, \ube44\uac00\ub3d9\uc2dc\uac04, \uac00\ub3d9\ub960)<br>\u2022 \ube44\uac00\ub3d9 \uc6d0\uc778 \ud30c\ub808\ud1a0 \uc21c\uc704 \uce74\ub4dc<br>\u2022 AI \uc6d0\uc778 \uc694\uc57d \ubc0f \uac1c\uc120 \uad8c\uace0 \ube0c\ub9ac\ud551 |\n| **FN-EQP-05** | **\uc124\ube44 \uc54c\ub78c \ud1b5\uacc4 \ubc0f \ube48\ubc1c \uc7a5\uc560 \ud328\ud134 \ubd84\uc11d** | \u2022 \uc124\ube44/\ud638\uae30/\uc54c\ub78c\ucf54\ub4dc\ubcc4 \ubc1c\uc0dd \ube48\ub3c4 \ubc0f \uc815\uc9c0 \uc2dc\uac04 \ud1b5\uacc4 \ubd84\uc11d\uc744 \ud1b5\ud55c \ub9cc\uc131 \ubc18\ubcf5 \uc54c\ub78c \ud328\ud134 \uc2dd\ubcc4 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ucd5c\uadfc 24\uc2dc\uac04 \ub3d9\uc548 S/C 1\ud638\uae30 \ubc1c\uc0dd \uc54c\ub78c \ud1b5\uacc4 \ubc0f \ube48\ubc1c \uc5d0\ub7ec \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 \uc54c\ub78c \ub85c\uadf8 API \uc5f0\ub3d9**: \uae30\uac04/\uc124\ube44\ubcc4 \uc54c\ub78c \ubc1c\uc0dd/\ud574\uc81c \ub85c\uadf8 \uc218\uc9d1<br>2. **\uac00\uacf5 \uc5f0\uc0b0**: \uc54c\ub78c\ubcc4 \uc124\ube44 \uc815\uc9c0 \uc18c\uc694 \uc2dc\uac04(\ubd84) \ubc0f \ucd5c\ub2e4 \ube48\ucd9c \uc54c\ub78c \ucf54\ub4dc \uc21c\uc704 \uc9d1\uacc4<br>3. **\ud328\ud134 \ub3c4\ucd9c**: Proc-SLM\uc774 \ubc18\ubcf5\uc131 \uc54c\ub78c \ud328\ud134 \uc694\uc57d \ube0c\ub9ac\ud551 \uc0dd\uc131 | \u2022 \uc54c\ub78c \ud1b5\uacc4 \uc694\uc57d \ud45c (\ubc1c\uc0dd \uac74\uc218, \uc5d0\ub7ec\ucf54\ub4dc, \ucd1d \uc815\uc9c0 \uc2dc\uac04)<br>\u2022 \ube48\ubc1c \uc54c\ub78c \ubd84\uc11d \ube0c\ub9ac\ud551 \uce74\ub4dc |\n\n---\n\n## 3. [\uac00\uce58 3] \uc790\uc7ac \ubc0f \uacf5\uc815 \uc7ac\uace0 \uc774\uc0c1 \ucd94\uc801 (Material & Process Inventory Tracking)\n\n### 3.1. \uac00\uce58 \uac1c\uc694 \ubc0f \ub3c4\uc785 \ubc30\uacbd\n- **\ud604\uc7a5 \ubb38\uc81c\uc810**: \uacf5\uc815 \uac04 \ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uc7ac\uacf5\ud488 \uc7ac\uace0 \uccb4\ub958 \uc2dc\uac04\uc774 \uacfc\ub3c4\ud558\uac8c \uc9c0\uc5f0\ub418\uac70\ub098 \uc120\uc785\uc120\ucd9c(FIFO)\uc774 \uc704\ubc18\ub420 \uacbd\uc6b0 \ud488\uc9c8 \ubcc0\uc9c8 \ubc0f \ud6c4\uc18d \uacf5\uc815 \uc167\ub2e4\uc6b4\uc774 \ubc1c\uc0dd\ud568.\n- **\uc81c\uacf5 \uac00\uce58**: WMS/MES \uc5f0\ub3d9\uc744 \ud1b5\ud574 \ubc84\ud37c \uad6c\uc5ed\uc758 \uccb4\ub958 \uc9c0\uc5f0 \ud488\ubaa9, \uc720\ud6a8\uae30\uac04 \uc784\ubc15 \uc790\uc7ac, \uacf5 \uc6a9\uae30 \uc794\ub7c9\uc744 \uc9c8\uc758\uc751\ub2f5\uc73c\ub85c \uc989\uc2dc \ud30c\uc545\ud558\uace0 \uc120\uc81c\uc801 \uc870\uce58 \ubaa9\ub85d \uc81c\uacf5.\n\n### 3.2. \uc138\ubd80 \uae30\ub2a5 \uba85\uc138\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-INV-01** | **\uc790\uc7ac \uc720\ud6a8\uae30\uac04 \ubc0f FIFO \uc704\ubc18 \uc774\uc0c1 \ud0d0\uc0c9** | \u2022 \uc790\uc7ac \ucc3d\uace0 \uad6c\uc5ed\ubcc4 \uc120\uc785\uc120\ucd9c(FIFO) \uc704\ubc18 \uac80\ucd9c \ubc0f \uc720\ud6a8\uae30\uac04(D-day) \uc784\ubc15 \uc790\uc7ac \uc774\uc0c1 \ucd94\uc801\u00b7\uacbd\uace0 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc6d0\uc790\uc7ac 2\ucc3d\uace0 \uc720\ud6a8\uae30\uac04 3\uc77c \uc774\ub0b4 \uc790\uc7ac \ubc0f FIFO \uc704\ubc18 \ubaa9\ub85d \ubcf4\uc5ec\uc918\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 WMS API \ud638\ucd9c**: \uc6d0\uc790\uc7ac \uad6c\uc5ed \uc7ac\uace0 Lot \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uc218\uc2e0<br>2. **\ube44\uad50 \uc5f0\uc0b0**: \uc785\uace0\uc77c\uc2dc \uae30\uc900 FIFO \uc704\ubc18 \uac80\ucd9c \ubc0f \uc720\ud6a8\uae30\uac04 \uc794\uc5ec \uc77c\uc218(D-day) \uacc4\uc0b0<br>3. **Proc-SLM**: \uc704\ud5d8\ub3c4 \uc21c \uc815\ub82c \ubc0f \uacbd\uace0 \ud3ec\ub9f7\ud305 | \u2022 \uc790\uc7ac Lot\ubcc4 \ud604\ud669 \ud45c (\uc785\uace0\uc77c, D-day, \uc801\uc7ac \ub799 \ubc88\ud638)<br>\u2022 FIFO \uc704\ubc18 \uacbd\uace0 \ubc30\ub108 |\n| **FN-INV-02** | **\uacf5\uc815 \ubc84\ud37c \uc815\uccb4 \uc9c4\ub2e8 \ubc0f \uccb4\ub958 \uc2dc\uac04 \ubd84\uc11d** | \u2022 \uacf5\uc815 \uac04 \ubc84\ud37c \uc7ac\uace0 \uccb4\ub958 \uc2dc\uac04 \ubd84\uc11d \ubc0f \uae30\uc900 \uc2dc\uac04(\uc608: 45\ubd84) \ucd08\uacfc \uc815\uccb4 \ud488\ubaa9 \uc2dd\ubcc4\u00b7\uc6d0\uc778 \uc9c4\ub2e8 | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\ubc84\ud37c \uad6c\uc5ed\uc5d0\uc11c \uccb4\ub958 \uc2dc\uac04 45\ubd84 \ucd08\uacfc\ub41c \uacf5\uc815 \uc7ac\uace0 \ubaa9\ub85d\uacfc \uc815\uccb4 \uc6d0\uc778 \ubd84\uc11d\"* ) | 1. **\uc911\uacc4 \uc11c\ubc84 MES API \uc5f0\ub3d9**: \uacf5\uc815 \ubc84\ud37c \uc801\uc7ac \ud488\ubaa9 \ubc0f \ud22c\uc785 \uc2dc\uac01 \uc218\uc2e0<br>2. **\uccb4\ub958 \uc2dc\uac04 \uacc4\uc0b0**: \ud604\uc7ac \uc2dc\uac01\uacfc\uc758 \ucc28\uc774 \uc5f0\uc0b0 \u2794 45\ubd84 \ucd08\uacfc(\uc9c0\uc5f0) \ud544\ud130\ub9c1<br>3. **\uacf5 \uc6a9\uae30 \uce74\uc6b4\ud2b8**: \uac00\uc6a9 \ube48 \uce90\ub9ac\uc5b4/\ud314\ub808\ud2b8 \uc218\ub7c9 \ub3d9\uc2dc \uc9d1\uacc4 | \u2022 \uacf5\uc815 \uc7ac\uace0 \uccb4\ub958 \ubd84\uc11d \ud45c (\ud488\ubaa9, \uce90\ub9ac\uc5b4ID, \uccb4\ub958\ubd84, \uc704\uce58)<br>\u2022 \uc8fc\uc758(\ud669\uc0c9)/\uc9c0\uc5f0(\uc801\uc0c9) \uc778\ub514\ucf00\uc774\ud130<br>\u2022 \uacf5 \ud314\ub808\ud2b8/\uc6a9\uae30 \uc794\uc5ec \uc218\ub7c9 \ubc0f \uc815\uccb4 \uc9c4\ub2e8 |\n| **FN-INV-03** | **\uacf5\uc815 \uac04 \ubb3c\ub958 \uc774\uc1a1 \uc9c0\uc5f0 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uce21** | \u2022 \uacf5\uc815 \uac04 \uc774\ub3d9 \uc911\uc778 \ud654\ubb3c\uc758 \uc774\uc1a1 \uc9c0\uc5f0 \ubcd1\ubaa9 \uad6c\uac04 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uc0c1 \uc2dc\uac01 \uc0b0\ucd9c | \u2022 \uc9c8\uc758 \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uac00\uacf5 1\ub77c\uc778\uc5d0\uc11c \uc870\ub9bd \ub77c\uc778\uc73c\ub85c \uc774\uc1a1 \uc911\uc778 \ubb3c\ub958 \ud604\ud669 \ubc0f \uc9c0\uc5f0 \uc5ec\ubd80\"* ) | 1. **\uc774\uc1a1 \ud2b8\ub798\ud0b9 API \uc5f0\ub3d9**: \uc774\uc1a1 \uc9c0\uc2dc \ud0dc\uc2a4\ud06c \ubc0f \uc6b4\uc1a1 \uc124\ube44(AGV \ud638\uae30) \uc704\uce58 \ucd94\uc801<br>2. **\uc9c0\uc5f0 \uc9c4\ub2e8**: \ud45c\uc900 \uc774\uc1a1 \uc2dc\uac04 \ub300\ube44 \uc9c0\uc5f0 \uad6c\uac04 \ud0d0\uc9c0 \ubc0f \ub3c4\ucc29 \uc608\uc0c1 \uc2dc\uac01 \uc0b0\ucd9c | \u2022 \uc774\uc1a1 \uc9c4\ub2e8 \uce74\ub4dc (\ud654\ubb3cID, \uc6b4\uc1a1AGV, \uc608\uc0c1\ub3c4\ucc29\uc2dc\uac01, \uc9c0\uc5f0 \uacbd\uace0) |\n\n---\n\n## 4. [\uac00\uce58 4] AI \uc2dc\uc2a4\ud15c \uc6b4\uc601 \uc9c0\uc6d0 \uc0b0\ucd9c\ubb3c \uc790\ub3d9 \uc81c\uacf5 (AI Operations Advisor & Artifacts)\n\n### 4.1. \uac00\uce58 \uac1c\uc694 \ubc0f \ub3c4\uc785 \ubc30\uacbd\n- **\ud604\uc7a5 \ubb38\uc81c\uc810**: \uc2e0\uaddc \uc124\ube44 \ub3c4\uc785, \uc2dc\uc2a4\ud15c \ubcc0\uacbd, \ube44\uc0c1 \uc0c1\ud669(\ub124\ud2b8\uc6cc\ud06c \ub2e8\uc120 \ub4f1) \ubc1c\uc0dd \uc2dc \uc5d4\uc9c0\ub2c8\uc5b4\uc758 \uac1c\uc778 \uacbd\ud5d8\uc5d0 \uc758\uc874\ud558\uc5ec \ud45c\uc900 \ubb38\uc11c \uc791\uc131\uacfc \uc810\uac80 \uc808\ucc28 \uc218\ub9bd\uc5d0 \ub9ce\uc740 \uc2dc\uac04\uc774 \uc18c\uc694\ub428.\n- **\uc81c\uacf5 \uac00\uce58**: AI \uc5d0\uc774\uc804\ud2b8\uac00 \uac00\uc0c1 \uc6b4\uc601 \uc5b4\ub4dc\ubc14\uc774\uc800 \uc5ed\ud560\uc744 \uc218\ud589\ud558\uc5ec \ud45c\uc900 \ub370\uc774\ud130 \ub9e4\ud551, \uc815\uae30 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8, \uc2dc\uc6b4\uc804 \ud14c\uc2a4\ud2b8 \uac00\uc774\ub4dc, BCP \uc218\ub3d9 \uc804\ud658 \uc808\ucc28\uc11c\ub97c \uc989\uc2dc \uc0dd\uc131 \ubc0f \uc9c0\uc6d0.\n\n### 4.2. \uc138\ubd80 \uae30\ub2a5 \uba85\uc138\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-ADV-01** | **\ud45c\uc900 \ub370\uc774\ud130 & \uc815\uae30 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc0dd\uc131** | \u2022 \uc2e0\uaddc/\uac1c\uc870 \uc124\ube44 \ub3c4\uc785 \uc2dc \ud45c\uc900 \ub370\uc774\ud130 \ub9e4\ud551 \ucd94\ucc9c \ubc0f \uc77c/\uc8fc/\uc6d4\uac04 \uc815\uae30 \uc608\ubc29 \ubcf4\uc804(PM) \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc790\ub3d9 \uc791\uc131 | \u2022 \uc0b0\ucd9c\ubb3c \uc694\uccad \ud504\ub86c\ud504\ud2b8 (\uc608: *\"\uc2e0\uaddc \ub3c4\uc785\ub41c RGV 5\ud638\uae30 \uc8fc\uac04 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc791\uc131\ud574\uc918\"* ) | 1. **\uc9c0\uc2dd \uac80\uc0c9**: \uc720\uc0ac RGV \ubaa8\ub378 \uc815\ube44 \ub9e4\ub274\uc5bc \ubc0f \ud45c\uc900 \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uac80\uc0c9<br>2. **Proc-SLM \uac00\uacf5**: \uc810\uac80 \ubd80\uc704(\uc13c\uc11c, \ubaa8\ud130, \uccb4\uacb0\ubd80), \ubc29\ubc95, \ud310\uc815 \uae30\uc900\uc744 \ud45c\uc900 PM \ud45c \uc591\uc2dd\uc73c\ub85c \uc0dd\uc131 | \u2022 PM \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \uc591\uc2dd \ud45c (\uc810\uac80 \ubd80\uc704, \ubc29\ubc95, \ud310\uc815 \uae30\uc900, \uc8fc\uae30)<br>\u2022 \ud45c\uc900 \ub9c8\uc2a4\ud130 \ub370\uc774\ud130 \uc81c\uc548 |\n| **FN-ADV-02** | **\ud14c\uc2a4\ud2b8 / \uc2dc\uc6b4\uc804 \uac00\uc774\ub4dc \uc9c0\uc6d0** | \u2022 \uc2dc\uc2a4\ud15c \ud328\uce58 \ub610\ub294 \uac1c\uc870 \uc2dc \ub2e8\uc704/\ud1b5\ud569 \ud14c\uc2a4\ud2b8 \ucf00\uc774\uc2a4 \ubc0f 5\ub2e8\uacc4 \uc2dc\uc6b4\uc804 \uc808\ucc28\uc11c \ucd08\uc548 \uc790\ub3d9 \uc218\ub9bd | \u2022 \uc0b0\ucd9c\ubb3c \uc694\uccad \ud504\ub86c\ud504\ud 4\ud398\uc774\uc2a4 (Platform Enabler)\n\n### 5.1. \uae30\ub2a5 \uac1c\uc694 \ubc0f \uc9c0\uc6d0 \ubaa9\uc801\n- **\uc9c0\uc6d0 \ubaa9\uc801**: \ub300\ud654 \uc138\uc158\uc774 \ubcc0\uacbd\ub418\uac70\ub098 \uc7ac\uc811\uc18d\ud560 \ub54c\ub9c8\ub2e4 50MB\uc5d0 \ub2ec\ud558\ub294 \uc815\ube44 \ub9e4\ub274\uc5bc\uc774\ub098 \ub3c4\uba74\uc744 \ub9e4\ubc88 \ubc18\ubcf5 \ucca8\ubd80\ud574\uc57c \ud558\ub294 \ubc88\uac70\ub85c\uc6c0\uc744 \ud574\uc18c\ud558\uace0, \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4\ubcc4\ub85c \uac80\uc0c9 \ubc94\uc704\ub97c \ud55c\uc815\ud558\uc5ec \ub2f4\ub2f9 \uc124\ube44\uc5d0 \ud2b9\ud654\ub41c \ub9de\ucda4\ud615 \uc815\ubc00 \ub2f5\ubcc0\uc744 \uc81c\uacf5\ud568.\n\n### 5.2. \uc138\ubd80 \uae30\ub2a5 \uba85\uc138\n\n| \uae30\ub2a5 ID | \uae30\ub2a5\uba85 (Function) | \uae30\ub2a5 \uc0c1\uc138 \uc815\uc758 | \uc785\ub825 (Input) | \uc791\ub3d9 \uba54\ucee4\ub2c8\uc998 (HOW - AI \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778) | \ucd9c\ub825 (Output) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **FN-PWS-01** | **\uac1c\uc778 / \ud300\ubcc4 \ud504\ub85c\uc81d\ud2b8 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4** | \u2022 \uac1c\uc778/\uc791\uc5c5\ubc18 \ub2e8\uc704\ub85c \ud504\ub85c\uc81d\ud2b8 \uacf5\uac04\uc744 \uc0dd\uc131\ud558\uace0 \uc790\uc8fc \ucc38\uc870\ud558\ub294 \ub9e4\ub274\uc5bc(PDF), \ub3c4\uba74\uc744 \uc601\uad6c \ubcf4\uad00\ud558\uc5ec \uc138\uc158 \ucd08\uc6d4 \uc7ac\ucc38\uc870 \uc9c0\uc6d0 | \u2022 \ud504\ub85c\uc81d\ud2b8 \uc0dd\uc131 \uba85\ub839, \ub9e4\ub274\uc5bc/\ub3c4\uba74 \ud30c\uc77c \uc5c5\ub85c\ub4dc | 1. **\ub3c5\ub9bd \ub124\uc784\uc2a4\ud398\uc774\uc2a4 \uc0dd\uc131**: \uac1c\uc778/\ud300 \uc6cc\ud06c\uc2a4\ud398\uc774\uc2a4 \uc2dd\ubcc4\uc790(ID) \ubd80\uc5ec<br>2. **\uc804\uc6a9 \uc778\ub371\uc2f1**: \uc5c5\ub85c\ub4dc\ub41c \ubb38\uc11c\ub97c \ud574\ub2f9 \ub124\uc784\uc2a4\ud398\uc774\uc2a4 \uc804\uc6a9 Vector DB\uc5d0 \ud30c\uc2f1 \ubc0f \uc800\uc7a5 | \u2022 \ud504\ub85c\uc81d\ud2b8 \uc9
